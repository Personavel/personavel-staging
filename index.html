:root{
  --pastel:#B8D9F2;--baby:#D5EAF8;--powder:#A9CDE8;--mint:#D6E9F8;--cream:#F8FBFD;
  --ink:#294B63;--navy:#426B87;--muted:#6E8BA0;--line:#DCEAF5;--white:#fff;
  --gold:#E9C46A;--peach:#F4B183;--pink:#F2B5C9;--lilac:#C9B6E8;--lemon:#F3DE8A;--blue:#5B9BD5;--mintd:#4A8CC4;
  --shadow:0 6px 22px rgba(66,107,135,.12);--shadow-sm:0 2px 10px rgba(66,107,135,.10);
  --r:18px;--side:248px;
  --serif:'Faustina',Georgia,serif;--script:'Dancing Script','Brush Script MT',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--serif);color:var(--ink);font-size:16px;line-height:1.5;
  background:linear-gradient(135deg,#C8E2F7 0%,#E4F1FC 45%,#9FCBEE 100%) fixed;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-weight:600;margin:0 0 .4em;line-height:1.25}
a{color:var(--navy)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex:0 0 var(--side);position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(213,234,248,.75));backdrop-filter:blur(8px);border-right:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font-family:var(--script);font-size:30px;color:var(--ink);letter-spacing:.5px;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:500;transition:background .2s}
.nav a:hover{background:rgba(184,217,242,.45)}
.nav a.on{background:linear-gradient(90deg,var(--pastel),var(--mint));box-shadow:var(--shadow-sm)}
.nav svg{width:20px;height:20px;flex:0 0 20px}
.side-foot{margin-top:auto;border-radius:var(--r);padding:14px;background:linear-gradient(160deg,#fff,var(--baby));box-shadow:var(--shadow-sm);text-align:center;font-size:14px}
.side-foot svg{width:100%;height:auto;max-height:110px}
.main{flex:1;min-width:0;padding:26px 30px 40px}
.bottom{display:none}

/* ---------- cards / bits ---------- */
.card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{border:0;border-radius:999px;padding:10px 18px;background:linear-gradient(90deg,#2F6FA3,#3D86C0);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.15);font-weight:600;box-shadow:var(--shadow-sm);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:#1F4E73;border:1.5px solid #8DB8DA;text-shadow:none}
.btn.mint{background:linear-gradient(90deg,#1F4E79,#2A6496)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:#2F6FA3;border-color:#2F6FA3;color:#fff;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--baby);color:var(--navy);margin:0 4px 4px 0}
.tag.warn{background:#FFF1D6;color:#9A6A12}.tag.ok{background:#DCEBF8;color:#1F4E79}.tag.mich{background:#FDE2E2;color:#A23B3B}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.title{font-size:28px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 18px}
.input{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;outline:none}
.input:focus{border-color:var(--powder);box-shadow:0 0 0 3px rgba(184,217,242,.5)}
.empty{text-align:center;padding:30px;color:var(--muted)}

/* ---------- dashboard ---------- */
.hello{display:flex;align-items:center;gap:20px;background:linear-gradient(120deg,#fff 0%,var(--baby) 60%,var(--mint) 100%);overflow:hidden;position:relative}
.hello h1{font-size:30px}.hello h1 em{font-family:var(--script);font-style:normal;font-size:38px;color:var(--navy)}
.hello svg.bot{width:130px;flex:0 0 130px}
.stat{text-align:center}.stat b{display:block;font-size:30px;color:var(--navy)}
.quick a{text-decoration:none;color:inherit}
.quick .card{display:flex;gap:14px;align-items:center;transition:transform .15s}
.quick .card:hover{transform:translateY(-2px)}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 46px}
.ico svg{width:24px;height:24px}

/* ---------- map ---------- */
.mapwrap{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;height:calc(100vh - 120px);min-height:520px}
.panel{display:flex;flex-direction:column;gap:12px;overflow:auto;padding-right:4px}
#map{border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);height:100%;min-height:420px;background:#E8F1F8}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer}
.pitem:hover{border-color:var(--powder)}
.bigacts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.bigact{display:flex;flex-direction:column;gap:6px;padding:22px 20px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);text-decoration:none;color:var(--ink);transition:transform .15s, box-shadow .15s}
.bigact:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.bigact .e{font-size:38px;line-height:1}
.bigact b{font-size:20px;color:#1F4E79}
.bigact small{color:var(--muted);font-size:14px;line-height:1.4}
@media (max-width:820px){.bigacts{grid-template-columns:1fr;gap:10px}.bigact{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:14px;padding:16px}.bigact .e{font-size:32px}.bigact b{font-size:18px;flex:1}.bigact small{flex-basis:100%;padding-left:46px;margin-top:-4px}}
.nav2{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.nav2 a{padding:7px 14px;font-size:14px;color:var(--muted)}
.nav2 a svg{width:18px;height:18px}
.mprof{display:none}
@media (max-width:820px){.mprof{display:grid;place-items:center;position:fixed;top:12px;right:12px;z-index:1150;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(31,78,121,.25);color:#1F4E79}
  .mprof svg{width:22px;height:22px}.mprof.on{background:#1F4E79;color:#fff}
  body:has(.drawer.open) .mprof,body:has(#chatpop.on) .mprof{display:none}}
html.simple #tsave,html.simple #d-visit,html.simple #d-snap,html.simple .lk-strip,html.simple .rv-box,html.simple .rv-favmark,html.simple .rv-mini,html.simple #mapStyleBtn,html.simple .wx-set,html.simple #wxfx,html.simple #wxtip,html.simple .fun-say,html.simple .fun-prop{display:none!important}
.maplegend{position:absolute;left:10px;bottom:22px;z-index:500;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 20px);pointer-events:auto}
.maplegend .seg{display:inline-flex;align-self:flex-start;background:#fff;border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(31,78,121,.22)}
.maplegend .seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#3E5C76}
.maplegend .seg button.on{background:#1F4E79;color:#fff}
.maplegend .lg{display:flex;flex-wrap:wrap;gap:4px 10px;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 10px;font-size:12px;color:#1F3550;box-shadow:0 2px 10px rgba(31,78,121,.18)}
.maplegend .lg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.maplegend .lg i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.maplegend .lg i.tripdot{background:linear-gradient(135deg,#FFD36E,#F4A259)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(41,75,99,.35)}
.pin span{transform:rotate(45deg);font-size:14px;line-height:1}
.leaflet-div-icon{background:none;border:0}
.youarehere{width:18px;height:18px;border-radius:50%;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.25)}
.stop{position:relative;display:grid;place-items:center}
.stop .num{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FFD36E,#F4A259);color:#fff;font-weight:700;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.stop .num.mine{background:linear-gradient(135deg,#B49CE6,#8E7CC3)}
.badge3d{position:absolute;bottom:42px;left:50%;transform:translateX(-50%) perspective(160px) rotateX(18deg);white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.6px;color:#fff;
  padding:4px 10px;border-radius:8px;background:linear-gradient(180deg,#6FB1E4,#3D7FB8);box-shadow:0 3px 0 #2C5F8A,0 6px 12px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.badge3d:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#2C5F8A;border-bottom:0}
.street-label{background:rgba(255,255,255,.9);border:1px solid var(--powder);border-radius:8px;padding:2px 8px;font-weight:600;color:var(--ink);box-shadow:var(--shadow-sm)}
.leaflet-popup-content-wrapper{border-radius:16px}
.leaflet-popup-content{margin:12px 14px;font-family:var(--serif)}

/* drawer */
.drawer{position:fixed;top:0;right:0;width:420px;max-width:100%;height:100%;background:#fff;box-shadow:-10px 0 30px rgba(41,75,99,.18);z-index:1200;transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:18px 20px 12px;background:linear-gradient(120deg,var(--baby),var(--mint));position:relative}
.drawer .body{padding:16px 20px 30px;overflow:auto}
.drawer .x{position:absolute;right:12px;top:12px;border:0;background:#fff;border-radius:50%;width:34px;height:34px;box-shadow:var(--shadow-sm)}
.kv{margin:10px 0}.kv b{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kv ul{margin:4px 0 0;padding-left:18px}
.cover{height:120px;border-radius:14px;margin-bottom:10px;display:grid;place-items:center;font-size:44px}

/* ---------- chat ---------- */
.chatwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;height:calc(100vh - 120px);min-height:520px}
.guides{display:flex;flex-direction:column;gap:10px;overflow:auto}
.guide{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer}
.guide.on{border-color:var(--powder);background:linear-gradient(90deg,var(--baby),#fff)}
.guide svg{width:52px;height:52px;flex:0 0 52px}
.chat{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:6px 4px 10px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:38px;height:38px;flex:0 0 38px}
.bubble{padding:11px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);white-space:pre-wrap;word-wrap:break-word}
.msg.me .bubble{background:linear-gradient(90deg,var(--pastel),var(--baby));border-color:var(--powder)}
.bubble .src{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--powder);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}
.tripcard{margin-top:8px;border-radius:14px;border:1px solid var(--powder);background:linear-gradient(180deg,#fff,var(--cream));padding:10px 12px}
.tripcard ol{margin:6px 0;padding-left:20px}.tripcard li{margin:4px 0}

/* ---------- trip ---------- */
.stops{display:flex;flex-direction:column;gap:10px}
.stopcard{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.stopcard .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 30px;background:linear-gradient(135deg,#FFD36E,#F4A259)}
.stopcard .n.mine{background:linear-gradient(135deg,#B49CE6,#8E7CC3)}
.leg{font-size:13px;color:var(--muted);padding-left:42px}
.leg a{font-weight:600}
.stopcard.origin{background:linear-gradient(90deg,#E8F3FC,#fff)}
.stopcard.origin .n{background:#fff;border:2px solid #1F6FC5;font-size:15px}
.dowhat{margin:4px 0 2px;color:var(--ink)}
.startflag{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#tripmap{height:420px;border-radius:var(--r);border:1px solid var(--line)}

/* ---------- collection ---------- */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:14px;font-size:13px;font-weight:600;border:3px dashed var(--powder);color:var(--muted);background:#fff;transform:rotate(-4deg)}
.stamp.got{border-style:solid;color:#fff;background:radial-gradient(circle,#7FB6E0,#4D8CC0);border-color:#fff;box-shadow:0 0 0 3px #4D8CC0,var(--shadow-sm)}
.stamp.got.food{background:radial-gradient(circle,#F7C08A,#E8935A);box-shadow:0 0 0 3px #E8935A,var(--shadow-sm)}
.stamp.got.shopping{background:radial-gradient(circle,#F3DE8A,#D9B44A);box-shadow:0 0 0 3px #D9B44A,var(--shadow-sm)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.badge{padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:center;filter:grayscale(1);opacity:.6}
.badge.got{filter:none;opacity:1;background:linear-gradient(160deg,#FFF8E1,#fff);border-color:var(--gold)}
.badge .e{font-size:34px}
.bar{height:10px;border-radius:999px;background:var(--baby);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--powder),var(--mintd));border-radius:999px;transition:width .4s}

/* ---------- profile ---------- */
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--pastel),var(--mint));display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;overflow:hidden;border:4px solid #fff;box-shadow:var(--shadow-sm)}
.avatar img{width:100%;height:100%;object-fit:cover}
.prefbar{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.diary{display:flex;gap:12px;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.diary img{width:90px;height:90px;object-fit:cover;border-radius:12px}

/* ---------- welcome / onboarding ---------- */
.overlay{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(120deg,#86BDE8 0%,#E4F1FC 30%,#A8D0F0 55%,#E4F1FC 75%,#76B1E2 100%);background-size:300% 300%;animation:grad 12s ease infinite}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.skip{position:absolute;top:18px;right:18px;z-index:3}
.logoText{font-family:var(--script);font-size:clamp(54px,11vw,128px);color:var(--ink);line-height:1;text-shadow:0 6px 24px rgba(66,107,135,.18)}
.slogan{font-size:clamp(18px,3vw,26px);color:var(--navy);letter-spacing:2px;margin-top:6px}
.welcome-center{text-align:center;position:relative;z-index:2;width:min(760px,92vw)}
.anim-in{animation:slideIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{transform:translateX(-60vw);opacity:0}to{transform:none;opacity:1}}
.fade{animation:fadeIn .45s ease both}.d1{animation-delay:1.25s}.d2{animation-delay:.6s}.d3{animation-delay:1.45s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flybot{position:absolute;width:150px;left:-180px;bottom:12vh;z-index:2;animation:arc 2.6s ease-in-out 1.2s forwards}
@keyframes arc{0%{left:-180px;bottom:12vh}50%{left:45vw;bottom:42vh}100%{left:calc(100vw - 210px);bottom:10vh}}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.7;filter:blur(1px);animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.ob{width:min(620px,94vw);background:rgba(255,255,255,.95);border-radius:24px;box-shadow:var(--shadow);padding:26px;position:relative;z-index:2}
.ob .botline{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.ob .botline svg{width:70px;flex:0 0 70px}
.ob .bubble{flex:1}
.prog{height:8px;border-radius:999px;background:var(--baby);overflow:hidden;margin:10px 0 18px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--powder),var(--mintd));transition:width .3s}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left;display:flex;gap:8px;align-items:center}
.opt.on{border-color:#2F6FA3;background:#E3EFF9;box-shadow:0 0 0 1px #2F6FA3 inset}
.opt .e{font-size:22px}
.intro-slides{display:grid;gap:12px;text-align:left;margin-top:18px}

/* tour */
.tour-hole{position:fixed;z-index:2500;border-radius:16px;box-shadow:0 0 0 9999px rgba(41,75,99,.45);transition:all .3s;pointer-events:none}
.tour-tip{position:fixed;z-index:2501;width:min(340px,90vw);background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:4000;box-shadow:var(--shadow);animation:fadeIn .3s}
.fab{position:fixed;right:22px;bottom:22px;width:68px;height:68px;border-radius:50%;border:0;background:linear-gradient(135deg,#fff,var(--baby));box-shadow:var(--shadow);z-index:1100;padding:4px;animation:bob 3.2s cubic-bezier(.45,.05,.55,.95) infinite;will-change:transform}
.fab svg{width:100%;height:100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.modal-bg{position:fixed;inset:0;background:rgba(41,75,99,.35);z-index:3500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:22px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}

body.reduce *,body.reduce *:before,body.reduce *:after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .side{display:none}
  .main{padding:16px 14px 92px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1150;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom a{display:flex;flex-direction:column;align-items:center;font-size:11px;text-decoration:none;color:var(--muted);padding:4px 4px;flex:1;min-width:0;white-space:nowrap;border-radius:12px;touch-action:manipulation}
  .bottom a.on{color:var(--ink);background:var(--baby);font-weight:600}
  .bottom svg{width:22px;height:22px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .mapwrap,.chatwrap{grid-template-columns:minmax(0,1fr);height:auto}
  #map{height:62vh}
  .panel{max-height:none;order:2}
  .guides{flex-direction:row;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.guide{flex:0 0 auto;padding:6px 10px}.guide svg{width:36px;height:36px;flex-basis:36px}.guide .tiny,.guides .card{display:none}.guides .btn{flex:0 0 auto;align-self:center}
  .toast{bottom:92px}
  .sugg{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.sugg .chip{flex:0 0 auto}
  .chat{height:calc(100vh - 200px)}
  .grid.g3.keep{grid-template-columns:repeat(3,1fr)}
  .chat{height:calc(100vh - 230px)}
  .fab{bottom:84px;right:14px;width:58px;height:58px}
  .hello{flex-direction:column;text-align:center}
  .title{font-size:24px}
  .drawer{width:100%}
}
.wavearm{animation:wave 2.4s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(-4deg)}75%{transform:rotate(-12deg)}}
.eye{animation:eyeblink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes eyeblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.btn.on{outline:2px solid var(--mintd)}
label.small input.input,label.small textarea.input{margin-top:4px}

.tilefail{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:450;max-width:360px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:var(--shadow)}

.side-user{display:flex;gap:10px;align-items:center;padding:10px;margin-top:auto;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.side-user:empty{display:none}
.side-user + .side-foot{margin-top:10px}
.linkbtn{border:0;background:none;padding:0;color:#B54848;text-decoration:underline;cursor:pointer}

.langsw{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--shadow-sm)}
.langsw button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.langsw button.on{background:#2F6FA3;color:#fff}
.welcome-lang{position:absolute;top:18px;left:18px;z-index:3}
.side-lang{margin:0 6px 12px;align-self:flex-start}.side-lang button{padding:5px 9px;font-size:12px}

/* intro: robot arrives with the logo, then a half circle underneath, ending on the right */
.intro-stage{position:relative;display:inline-block;padding:0 10px}
.introbot{position:absolute;width:clamp(78px,10vw,118px);top:0;left:0;z-index:3;will-change:transform;opacity:0}
.introbot svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(66,107,135,.25))}
.introbot.landed svg{animation:hover 2.6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.welcome-center .slogan{margin-top:clamp(16px,2vw,24px)}
/* photos */
.cover.photo{padding:0;border:0;width:100%;height:190px;overflow:hidden;cursor:zoom-in;display:block;border-radius:14px}
.cover.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.cover.photo:hover img{transform:scale(1.04)}
.pitem .thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:0 0 44px}
.lightbox{position:fixed;inset:0;z-index:5000;background:rgba(20,35,48,.86);display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox figure{margin:0;max-width:min(1100px,94vw);text-align:center}

.hero-shade{background:linear-gradient(90deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.15) 45%,rgba(255,255,255,0) 100%)!important}

/* badge celebration */
.greetpop.celebrate{overflow:hidden;border:2px solid #7FC3EA}
.greetpop.celebrate .gp-bot{animation:cheer 1s ease-in-out 3}
@keyframes cheer{0%,100%{transform:none}30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(-6px) rotate(6deg)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:0}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:0;animation:fall 2s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(260px) rotate(540deg)}}
.greetpop.celebrate > *:not(.confetti){position:relative;z-index:1}
.greetpop.celebrate .gp-x{position:absolute;z-index:3}
body.reduce .confetti{display:none}
/* badge celebration v2: guide jumps to the centre first, then the message appears */
.celebrate-ov{position:fixed;inset:0;z-index:3600;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(31,78,121,.0);animation:celBg .4s ease forwards;overflow:hidden}
.celebrate-ov.out{animation:celOut .3s ease forwards}
@keyframes celBg{to{background:rgba(31,78,121,.42)}}
@keyframes celOut{to{opacity:0}}
.cel-box{display:flex;flex-direction:column;align-items:center;width:min(440px,94vw);position:relative;z-index:1}
.cel-bot{position:relative;width:clamp(150px,22vw,200px);animation:celJump 1.1s cubic-bezier(.25,.9,.35,1) both, celDance 1.4s ease-in-out 1.15s 2}
.cel-bot svg{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 18px rgba(20,40,60,.3))}
@keyframes celJump{0%{transform:translateY(70vh) scale(.5) rotate(-12deg);opacity:0}45%{transform:translateY(-60px) scale(1.08) rotate(6deg);opacity:1}65%{transform:translateY(0) scale(.94,1.06)}80%{transform:translateY(-18px) scale(1.02)}100%{transform:none}}
@keyframes celDance{0%,100%{transform:none}25%{transform:translateY(-12px) rotate(-7deg)}50%{transform:none}75%{transform:translateY(-12px) rotate(7deg)}}
.cel-badge{position:absolute;right:-6px;top:6px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6C8,#F4C430);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.2);animation:celPop .5s cubic-bezier(.2,1.6,.4,1) 1s both}
@keyframes celPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.cel-card{position:relative;margin-top:-6px;background:#fff;border-radius:22px;padding:18px 18px 14px;text-align:center;font-size:15px;box-shadow:0 18px 50px rgba(20,40,60,.35);border:2px solid #7FC3EA;animation:celCard .5s cubic-bezier(.2,.9,.3,1.25) 1.05s both}
.cel-card:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#7FC3EA}
@keyframes celCard{from{opacity:0;transform:translateY(20px) scale(.85)}to{opacity:1;transform:none}}
.cel-title{font-size:21px;font-weight:700;color:#1F4E79;margin-bottom:6px;padding:0 24px}
.cel-x{position:absolute;top:8px;right:8px;border:0;background:var(--baby);border-radius:50%;width:30px;height:30px;cursor:pointer}
.celebrate-ov .confetti i{top:-14px;animation-name:celFall}
@keyframes celFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:.2;transform:translateY(105vh) rotate(720deg)}}
body.reduce .cel-bot,body.reduce .cel-card,body.reduce .cel-badge{animation:none}
/* ===== Saigon Collection v2: rubber stamps + medals ===== */
.stamps2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.stamp2{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;position:relative}
.stamp2.got{transform:rotate(var(--r,0deg));transition:transform .2s}
.stamp2.got:hover{transform:rotate(0) scale(1.05)}
.stampsvg{width:100%;height:auto;display:block;font-family:inherit;mix-blend-mode:multiply;opacity:.92}
.stamps2.wait{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 10px}
.stamps2.wait .stamp2{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.stamps2.wait .ring{width:78px;height:78px;border-radius:50%;border:2.5px dashed #C3D3E0;display:grid;place-items:center;color:#AFC0CE;background:#fff;transition:.2s}
.stamps2.wait .ring .ic{width:40px;height:40px}
.stamps2.wait .stamp2:hover .ring{border-color:var(--c);color:var(--c);transform:scale(1.06)}
.stamps2.wait .nm{font-size:12.5px;line-height:1.25;color:var(--muted);max-width:120px}
.badges .badge2{padding:14px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:center;position:relative}
.badge2 .medal{width:84px;margin:0 auto 6px}
.badge2 .medalsvg{width:100%;height:auto;display:block}
.badge2:not(.got){opacity:.75}
.badge2:not(.got) b{color:var(--muted)}
.badge2.got{background:linear-gradient(170deg,#FFF8DF,#fff 60%);border-color:#E9CD72;box-shadow:0 6px 18px rgba(201,154,30,.15)}
.badge2.got .medal{animation:medalSwing 4s ease-in-out infinite;transform-origin:50% 0}
@keyframes medalSwing{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}

/* ceremony overlay */
.slam-ov{position:fixed;inset:0;z-index:3600;cursor:pointer;background:rgba(20,40,60,0);transition:background .35s}
.slam-ov.lit{background:radial-gradient(circle at var(--x) var(--y),rgba(20,40,60,0) 0,rgba(20,40,60,0) var(--r),rgba(20,40,60,.55) calc(var(--r) + 50px))}
.slam-ov.out{opacity:0;transition:opacity .25s}
.slam-cap{position:fixed;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:10px 18px;box-shadow:0 12px 30px rgba(20,40,60,.3);text-align:center;opacity:0;width:max-content;max-width:min(440px,92vw)}
.slam-cap.on{animation:capIn .45s cubic-bezier(.2,.9,.3,1.3) .5s forwards}
.slam-cap b{display:block;color:#1F4E79;font-size:17px}
.slam-cap span{font-size:13px;color:var(--muted)}
@keyframes capIn{from{opacity:0;transform:translate(-50%,12px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
.slam-hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,40,60,.78);color:#fff;padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;white-space:nowrap}
.slam-ov.ready .slam-hint{opacity:1;animation:hintPulse 1.8s ease-in-out infinite}
@keyframes hintPulse{50%{transform:translateX(-50%) scale(1.05)}}
.slamming{position:relative;z-index:3700}
.stamp2.slamming{animation:stampSlam .62s cubic-bezier(.55,0,.8,.3) both}
@keyframes stampSlam{0%{transform:translateY(-40px) scale(3) rotate(calc(var(--r,0deg) - 28deg));opacity:0;filter:drop-shadow(0 40px 30px rgba(0,0,0,.35))}
  55%{opacity:1}62%{transform:scale(.9) rotate(var(--r,0deg));filter:drop-shadow(0 0 0 rgba(0,0,0,0))}
  78%{transform:scale(1.06) rotate(var(--r,0deg))}100%{transform:rotate(var(--r,0deg));opacity:1}}
.stamp2.slamming:after{content:"";position:absolute;inset:-6%;border-radius:50%;border:3px solid currentColor;opacity:0;animation:inkRing .7s ease-out .38s}
@keyframes inkRing{0%{opacity:.6;transform:scale(.9)}100%{opacity:0;transform:scale(1.6)}}
.badge2.unlocking{animation:badgeRise .5s ease both}
@keyframes badgeRise{from{transform:scale(.9)}to{transform:scale(1.04)}}
.badge2.unlocking .medal{animation:medalDrop 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes medalDrop{0%{transform:translateY(-160px) rotate(-25deg) scale(1.6);opacity:0}50%{opacity:1}70%{transform:translateY(0) rotate(8deg) scale(1.15)}85%{transform:rotate(-4deg) scale(1.05)}100%{transform:none}}
.badge2.unlocking .shine{animation:shine 1.2s ease .9s 2}
@keyframes shine{0%,100%{opacity:.2}50%{opacity:1}}
.slam-ov i.ink,.slam-ov i.conf{position:fixed;width:9px;height:9px;border-radius:50%;margin:-4px 0 0 -4px;opacity:0;animation:splat .7s ease-out forwards}
.slam-ov i.conf{width:8px;height:12px;border-radius:2px;animation:confBurst 1.3s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes splat{0%{opacity:.85;transform:translate(0,0) scale(1.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes confBurst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 120px)) rotate(600deg)}}
#main.thud{animation:thud .35s ease}
@keyframes thud{20%{transform:translate(2px,3px)}40%{transform:translate(-3px,-1px)}60%{transform:translate(2px,-2px)}80%{transform:translate(-1px,1px)}}
body.reduce .stamp2.slamming,body.reduce .badge2.unlocking .medal{animation-duration:.01s}
@media (max-width:820px){.stamps2{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.slam-hint{bottom:90px}}
/* cute stamps v3 */

/* ===== Khoảnh khắc – Locket-style square photos ===== */
.lk-ov{position:fixed;inset:0;z-index:3500;background:rgba(8,12,20,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px;animation:lkIn .25s ease}

.lk-sheet{width:min(420px,100%);background:#141414;color:#fff;border-radius:34px;padding:16px 18px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:'Nunito','Segoe UI',system-ui,sans-serif}

.lk-top b{flex:1;text-align:center;font-size:17px;font-weight:800;letter-spacing:.3px}
.lk-x,.lk-sp{width:36px;height:36px}
.lk-x{border:0;border-radius:50%;background:#2a2a2a;color:#fff;font-size:15px}
.lk-frame{position:relative;width:100%;aspect-ratio:1/1;border-radius:44px;overflow:hidden;background:#000}
.lk-frame video,.lk-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lk-frame video.mirror{transform:scaleX(-1)}
.lk-shot{display:none}
.lk-ov.taken .lk-shot{display:block}
.lk-ov.taken video{visibility:hidden}
.lk-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#ddd;font-size:15px;line-height:1.5}
.lk-msg[hidden]{display:none}
.lk-loc{position:absolute;left:14px;top:14px;max-width:calc(100% - 28px);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-cap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:auto;min-width:160px;max-width:84%;border:0;outline:0;text-align:center;border-radius:999px;padding:9px 16px;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);color:#fff;font:700 15px 'Nunito','Segoe UI',system-ui,sans-serif;display:none}

.lk-ov.taken .lk-cap{display:block}
.lk-ctrl,.lk-ctrl2{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 4px}
.lk-ctrl2{display:none}
.lk-ov.taken .lk-ctrl{display:none}
.lk-ov.taken .lk-ctrl2{display:flex}
.lk-side{width:46px;height:46px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer}
.lk-shutter{width:78px;height:78px;border-radius:50%;border:4px solid #F5C518;background:transparent;padding:5px;cursor:pointer}
.lk-shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s}
.lk-shutter:active i{transform:scale(.88)}
.lk-send{border:0;border-radius:999px;background:#F5C518;color:#141414;font-weight:800;padding:13px 22px;font-size:15px;cursor:pointer}
.lk-where{display:grid;gap:6px;margin-top:12px;font-size:13px;color:#bbb}
.lk-where select{background:#222;color:#fff;border:1px solid #333;border-radius:14px}
.lk-ov.flash .lk-frame:after{content:"";position:absolute;inset:0;background:#fff;animation:flash .25s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
/* grid of moments */
.lk-sec{margin:10px 0 14px}
.lk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:8px}
.lk-add,.lk-tile{position:relative;aspect-ratio:1/1;border-radius:26px;overflow:hidden;border:0;padding:0;cursor:pointer}
.lk-add{background:linear-gradient(160deg,#1C1C1C,#2E2E2E);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Nunito','Segoe UI',system-ui,sans-serif}

/* ===== weather: card in the drawer ===== */
.wxcard{margin:0 0 14px;padding:12px 14px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#4FA3E3,#2F6FA3);box-shadow:0 6px 18px rgba(30,70,110,.18);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.wxcard.loading,.wxcard.off{background:var(--baby,#EEF6FD);color:var(--muted,#5b7085);text-shadow:none;font-size:14px}
.wxcard.wx-clear{background:linear-gradient(135deg,#FFB547,#F57C3A)}
.wxcard.wx-cloudy{background:linear-gradient(135deg,#9FB3C8,#6E86A0)}
.wxcard.wx-fog{background:linear-gradient(135deg,#B9C4CE,#8E9CA8)}
.wxcard.wx-drizzle{background:linear-gradient(135deg,#7FB2D9,#4C7FA8)}
.wxcard.wx-rain{background:linear-gradient(135deg,#4F7FAF,#2C4F78)}
.wxcard.wx-storm{background:linear-gradient(135deg,#4A4F78,#232645)}
.wxcard.night{background:linear-gradient(135deg,#2B3C6E,#141F40)}
.wx-main{display:flex;align-items:center;gap:10px}
.wx-ic{font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.wx-main b{font-size:17px}
.wx-main .tiny{opacity:.9}
.wx-t{margin-left:auto;font-size:34px;font-weight:800;letter-spacing:-1px}
.wx-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:13.5px}
.uvpill{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;color:#fff;margin-left:2px;text-shadow:none}
/* ===== weather: full-screen effects ===== */
.wxfx{position:fixed;inset:0;z-index:1250;pointer-events:none;overflow:hidden;transition:opacity 1.1s}
.wxfx.out{opacity:0}
.wx-rain{background:linear-gradient(180deg,rgba(30,50,80,.18),rgba(30,50,80,.05))}
.wx-rain .drop{position:absolute;top:-40px;width:2px;border-radius:2px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(200,225,255,.95));transform:rotate(12deg);animation:drop linear infinite}
.wx-rain.light .drop{width:1.5px}
@keyframes drop{to{transform:translate(-22vh,112vh) rotate(12deg)}}
.wx-rain .splash{position:absolute;bottom:6px;width:14px;height:4px;border-radius:50%;border:1.5px solid rgba(220,235,255,.8);animation:splash 1s ease-out infinite;opacity:0}
@keyframes splash{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.wx-storm{background:linear-gradient(180deg,rgba(15,20,45,.42),rgba(15,20,45,.15))}
.wx-storm .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flashes 4.5s infinite}
@keyframes flashes{0%,7%,100%{opacity:0}2%{opacity:.75}4%{opacity:.1}5.5%{opacity:.55}}
.wx-storm .bolt{position:absolute;left:62%;top:2%;width:70px;opacity:0;fill:#FFF6B0;filter:drop-shadow(0 0 12px #fff);animation:bolt 4.5s infinite}
@keyframes bolt{0%,7%,100%{opacity:0}2%,5.5%{opacity:1}}
.wx-sun .glare{position:absolute;right:-18vmax;top:-22vmax;width:62vmax;height:62vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,250,215,.95) 0,rgba(255,214,110,.55) 18%,rgba(255,190,90,0) 60%);animation:glare 4s ease-in-out infinite alternate}
.wx-sun .rays{position:absolute;right:-30vmax;top:-34vmax;width:90vmax;height:90vmax;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,150,.22) 0 4deg,transparent 4deg 13deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:rays 30s linear infinite}
.wx-sun .haze{position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,200,120,.18),transparent 55%)}
.wx-sun.harsh .haze{background:linear-gradient(200deg,rgba(255,170,90,.3),rgba(255,210,150,.08) 60%);animation:shimmer 2.4s ease-in-out infinite alternate}
@keyframes glare{to{transform:scale(1.08);opacity:.85}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes shimmer{to{opacity:.6;filter:blur(1px)}}
.wx-cloud{background:linear-gradient(180deg,rgba(120,140,165,.15),transparent 60%)}
.wx-cloud .cloud{position:absolute;left:-40vw;width:38vw;height:12vw;max-height:160px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(235,242,250,.5) 55%,transparent);filter:blur(6px);animation:cloudGo linear infinite}
@keyframes cloudGo{to{left:110vw}}
.wx-fog .mist{position:absolute;left:-30%;width:160%;height:45%;background:radial-gradient(50% 50% at 50% 50%,rgba(240,244,248,.75),transparent 70%);filter:blur(10px);animation:mist 18s ease-in-out infinite alternate}
.wx-fog .m1{top:10%}.wx-fog .m2{top:40%;animation-duration:24s;animation-direction:alternate-reverse}.wx-fog .m3{top:65%;animation-duration:30s}
@keyframes mist{to{transform:translateX(12%)}}
.wx-night{background:linear-gradient(180deg,rgba(10,20,50,.25),transparent 60%)}
.wx-night .tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:twinkle 2.2s ease-in-out infinite alternate}
body.reduce .wxfx{display:none}
/* ===== weather: guide advice bubble ===== */
.wxtip{position:fixed;right:22px;bottom:104px;z-index:1300;display:flex;align-items:flex-end;gap:6px;max-width:min(380px,calc(100vw - 30px));animation:tipIn .45s cubic-bezier(.2,.9,.3,1.3) both}
.wxtip.out{opacity:0;transform:translateY(10px);transition:.3s}
@keyframes tipIn{from{opacity:0;transform:translateY(16px) scale(.94)}}
.wxtip-b{background:#fff;color:#1F3550;border-radius:18px 18px 4px 18px;padding:12px 14px;box-shadow:0 10px 28px rgba(20,40,70,.25);font-size:14px;line-height:1.45}
.wxtip-b b{display:block;font-size:15px;margin-bottom:4px;color:#1F4E79}
.wxtip-b p{margin:4px 0 0}
.wxtip-bot{flex:0 0 62px;width:62px;animation:bob 3s ease-in-out infinite}
.wxtip-bot svg{width:100%;height:auto}
.wxtip-x{position:absolute;top:-10px;left:-10px;width:26px;height:26px;border-radius:50%;border:0;background:#1F4E79;color:#fff;font-size:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
@media (max-width:820px){.wxtip{right:10px;bottom:150px}}
/* ===== night & galaxy v2: denser twinkling stars, colour drift, frequent shooting stars ===== */
.pvbgx .s6,.pvbgx .s7,.pvbgx .tint{opacity:0}
.pvbgx.has-stars .s6{opacity:1;animation:twinkle2 1.7s ease-in-out -.4s infinite alternate}
.pvbgx.has-stars .s7{opacity:1;filter:drop-shadow(0 0 3px rgba(255,255,255,.95));animation:twinkle2 2.9s ease-in-out -1.3s infinite alternate}
.pvbgx.has-stars .s2{animation:twinkle2 3.3s ease-in-out -.8s infinite alternate}
.pvbgx.has-stars .s3{animation:twinkle2 2.1s ease-in-out -1s infinite alternate}
@keyframes twinkle2{0%{opacity:.15}55%{opacity:.9}100%{opacity:1}}
.pvbgx.has-stars .spk{animation-name:glint2}
@keyframes glint2{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(calc(var(--s)*.35)) rotate(0)}45%{opacity:1;transform:translate(-50%,-50%) scale(calc(var(--s)*1.15)) rotate(25deg)}60%{opacity:.85}}
/* colour drift: soft colour clouds slide and cross-fade, sky hue sways */
.pvbgx.has-stars .tint{opacity:1;position:absolute;inset:-25%;
  background:radial-gradient(35% 30% at 20% 30%,rgba(120,80,255,.32),transparent 70%),radial-gradient(32% 28% at 80% 25%,rgba(255,90,170,.22),transparent 70%),radial-gradient(40% 35% at 60% 80%,rgba(40,170,255,.28),transparent 70%),radial-gradient(30% 25% at 30% 75%,rgba(80,230,200,.16),transparent 70%);
  animation:tintMove 26s ease-in-out infinite alternate,tintFade 11s ease-in-out infinite alternate;mix-blend-mode:screen}
.pvbgx.th-night .tint{background:radial-gradient(35% 30% at 20% 30%,rgba(70,120,255,.3),transparent 70%),radial-gradient(32% 28% at 80% 25%,rgba(130,90,255,.2),transparent 70%),radial-gradient(40% 35% at 60% 80%,rgba(40,200,255,.22),transparent 70%)}
@keyframes tintMove{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(6%,-4%) rotate(8deg)}100%{transform:translate(-5%,5%) rotate(-6deg)}}
@keyframes tintFade{0%{opacity:.55}100%{opacity:1}}
.pvbgx.has-stars .g{animation:skyBreath 50s ease-in-out infinite alternate,skyHue 18s ease-in-out infinite alternate}
@keyframes skyHue{0%{filter:hue-rotate(-14deg) saturate(1)}100%{filter:hue-rotate(18deg) saturate(1.25) brightness(1.08)}}
/* shooting stars */
.pvbgx .meteors{position:absolute;inset:0}
.pvbgx .meteor{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(200,220,255,.7) 70%,#fff);filter:drop-shadow(0 0 6px rgba(255,255,255,.9));opacity:0;transform-origin:100% 50%;
  transform:rotate(calc(180deg + var(--a))) translateX(0);animation:meteor 1.1s ease-in forwards}
.pvbgx .meteor:after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.9)}
@keyframes meteor{0%{opacity:0;transform:rotate(calc(180deg + var(--a))) translateX(0)}10%{opacity:1}80%{opacity:1}100%{opacity:0;transform:rotate(calc(180deg + var(--a))) translateX(var(--d))}}
.pvbgx.has-shoot .shoot{display:none}
body.reduce .pvbgx .meteor{display:none}
/* ===== intro: background colours swap places with a flash after the logo appears ===== */
.introswap{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;animation:swOut .8s ease 2.1s forwards}
.introswap i{position:absolute;inset:0}
.introswap .sa{background:linear-gradient(180deg,var(--dk) 0%,var(--md) 100%);opacity:0;mix-blend-mode:normal;animation:swA 1.5s ease forwards}
.introswap .sb{opacity:.78;background:linear-gradient(180deg,var(--md) 0%,var(--dk) 100%);clip-path:circle(0% at 50% 100%);animation:swB 1.5s cubic-bezier(.7,0,.25,1) .35s forwards}
.introswap .flash{background:radial-gradient(60% 45% at 50% 55%,var(--lt),transparent 70%);opacity:0;mix-blend-mode:screen;animation:swF .9s ease-out .6s forwards}
@keyframes swA{0%{opacity:0}25%{opacity:.72}100%{opacity:.72;transform:translateY(8%)}}
@keyframes swB{0%{clip-path:circle(0% at 50% 100%)}100%{clip-path:circle(150% at 50% 100%)}}
@keyframes swF{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}
@keyframes swOut{to{opacity:0}}
/* intro swap v2: diagonal sweep from top-left to bottom-right (no dome) */
.introswap .sb{background:linear-gradient(135deg,var(--md) 0%,var(--dk) 100%)!important;clip-path:polygon(0 0,0 0,0 0)!important;animation:swDiag 1.3s cubic-bezier(.65,0,.3,1) .35s forwards!important}
@keyframes swDiag{0%{clip-path:polygon(0 0,0 0,0 0)}100%{clip-path:polygon(0 0,200% 0,0 200%)}}
.introswap .flash{background:linear-gradient(135deg,transparent 40%,var(--lt) 49%,#fff 50%,var(--lt) 51%,transparent 60%)!important;background-size:300% 300%!important;background-position:100% 100%;mix-blend-mode:screen;opacity:0;animation:swStreak 1.3s cubic-bezier(.65,0,.3,1) .35s forwards!important}
@keyframes swStreak{0%{opacity:0;background-position:100% 100%}12%{opacity:.95}85%{opacity:.85}100%{opacity:0;background-position:0% 0%}}
.introswap .flash{inset:auto!important;left:-60%;top:-60%;width:40%;height:220%;transform:rotate(-45deg);transform-origin:50% 50%;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--lt) 70%,transparent) 35%,rgba(255,255,255,.95) 50%,color-mix(in srgb,var(--lt) 70%,transparent) 65%,transparent)!important;background-size:auto!important;
  filter:blur(6px);mix-blend-mode:screen;opacity:0;animation:swBeam 1.3s cubic-bezier(.6,0,.35,1) .35s forwards!important}
@keyframes swBeam{0%{opacity:0;left:-60%;top:-80%}12%{opacity:1}85%{opacity:.9}100%{opacity:0;left:120%;top:60%}}
.introswap .sb{opacity:.9!important;background:linear-gradient(135deg,var(--lt) 0%,var(--md) 35%,var(--dk) 100%)!important}
.introswap .flash{transform:rotate(45deg)!important;width:34%!important;height:260%!important;animation-name:swBeam2!important;animation-duration:1.4s!important}
@keyframes swBeam2{0%{opacity:0;left:-52%;top:-160%}12%{opacity:1}85%{opacity:.9}100%{opacity:0;left:108%;top:-10%}}
/* intro swap v3: a bright streak zips from the top-left corner to the bottom-right corner, colours follow it */
.introswap .streak{inset:auto!important;left:0;top:0;width:var(--len);height:5px;border-radius:5px;transform-origin:0 50%;
  background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--lt) 35%,transparent) 45%,var(--lt) 82%,#fff 100%);
  filter:drop-shadow(0 0 8px var(--lt)) drop-shadow(0 0 16px color-mix(in srgb,var(--lt) 70%,transparent));opacity:0;
  transform:rotate(var(--ang)) translateX(calc(-1 * var(--len)));animation:zip .75s cubic-bezier(.55,.05,.4,1) .35s forwards}
.introswap .streak b{position:absolute;right:-6px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 0 14px 6px var(--lt),0 0 30px 12px color-mix(in srgb,var(--lt) 60%,transparent)}
.introswap .streak.s2{height:2px;top:-26px;left:12px;opacity:0;animation-delay:.42s;filter:drop-shadow(0 0 6px var(--lt))}
.introswap .streak.s2 b{width:8px;height:8px;margin-top:-4px;right:-3px}
@keyframes zip{0%{opacity:0;transform:rotate(var(--ang)) translateX(calc(-1 * var(--len)))}8%{opacity:1}90%{opacity:1}100%{opacity:0;transform:rotate(var(--ang)) translateX(var(--diag))}}
.introswap .sb{animation:swDiag .95s cubic-bezier(.55,.05,.4,1) .45s forwards!important}
.introswap .streak{animation-duration:1.05s!important;animation-timing-function:cubic-bezier(.35,0,.65,1)!important}.introswap .sb{animation-duration:1.15s!important;animation-timing-function:cubic-bezier(.35,0,.65,1)!important}
/* intro swap v4: smoother – soft-edged colour wipe following the streak, softer fade */
.introswap{animation:swOut 1.3s cubic-bezier(.4,0,.2,1) 2.3s forwards!important}
.introswap .sa{animation:swA2 1.6s cubic-bezier(.4,0,.2,1) forwards!important}
@keyframes swA2{0%{opacity:0}35%{opacity:.7}100%{opacity:.7}}
.introswap .sb{clip-path:none!important;opacity:.85!important;
  -webkit-mask-image:linear-gradient(135deg,#000 38%,transparent 62%);mask-image:linear-gradient(135deg,#000 38%,transparent 62%);
  -webkit-mask-size:300% 300%;mask-size:300% 300%;-webkit-mask-position:100% 100%;mask-position:100% 100%;
  animation:swSoft 1.25s cubic-bezier(.35,0,.65,1) .42s forwards!important}
@keyframes swSoft{to{-webkit-mask-position:0% 0%;mask-position:0% 0%}}
.introswap .streak{animation-duration:1.15s!important;animation-timing-function:cubic-bezier(.33,0,.67,1)!important;will-change:transform,opacity}
/* logo lights up as the streak passes, then keeps a soft glow */
.logoText.lit{animation:logoLit 1.6s cubic-bezier(.25,.1,.25,1) forwards}
@keyframes logoLit{
  0%{filter:brightness(1);text-shadow:0 0 0 transparent}
  30%{filter:brightness(1.45);text-shadow:0 0 18px #fff,0 0 42px var(--lt),0 0 80px var(--lt)}
  100%{filter:brightness(1.12);text-shadow:0 0 10px color-mix(in srgb,#fff 70%,transparent),0 0 26px color-mix(in srgb,var(--lt) 80%,transparent),0 0 54px color-mix(in srgb,var(--lt) 45%,transparent)}}

/* ===== guide robot idle fun ===== */

.ob{width:min(620px,92vw)!important;padding:26px 26px 20px!important;border-radius:28px!important;position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(234,243,251,.88))!important;border:1px solid rgba(127,184,230,.45)!important;
  box-shadow:0 24px 60px rgba(31,78,121,.18),inset 0 1px 0 #fff!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ob::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(127,184,230,.35),transparent 70%);pointer-events:none}
.ob::after{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(214,40,57,.10),transparent 70%);pointer-events:none}

.ob-slide{position:relative}
.ob-ic{display:inline-block;margin-right:8px;vertical-align:-3px;font-size:24px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12));animation:icPop .5s cubic-bezier(.2,1.6,.4,1) .15s both}
@keyframes icPop{from{transform:scale(0) rotate(-30deg)}}
.ob-hl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}

.tipbox .tb-h{display:block;margin-bottom:6px;color:var(--navy)}
.tipbox ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tipbox li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.tipbox li .ti{flex:0 0 22px;text-align:center}
.tipbox li.wx{background:rgba(255,255,255,.75);border-radius:10px;padding:5px 6px;font-weight:600;animation:tipIn .5s ease}
@keyframes tipIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
body.hued .tipbox{background:color-mix(in srgb,var(--acc1) 12%,var(--cardbg));border-color:var(--line)}
body.glass-dark .tipbox{background:color-mix(in srgb,var(--acc1) 30%,rgba(10,8,32,.6));border-color:var(--glassline)}
body.glass-dark .tipbox .tb-h,body.glass-dark .tipbox li{color:var(--ink)}
body.glass-dark .tipbox li.wx{background:rgba(255,255,255,.1)}
.stoptips{display:grid;gap:3px;margin-top:6px;font-size:13px;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--baby,#EAF4FD) 60%,transparent);border-radius:10px;padding:6px 8px}
body.glass-dark .stoptips{background:rgba(255,255,255,.08)}
/* v86: smooth motion on phones (html.lite) — keep the look, drop the expensive paints */
html.lite #pvbg{contain:strict}
html.lite #pvbg > *{will-change:transform,opacity}
html.lite #pvbg .g{animation-name:skyBreathLite!important}
@keyframes skyBreathLite{0%{transform:translateY(0)}100%{transform:translateY(-4%)}}
html.lite #pvbg .g::after,html.lite #pvbg .g::before{animation:none!important}
html.lite [style*="skyHue"],html.lite .skyhue{animation:none!important}
html.lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lite body.hued .card:not(.hero),html.lite body.hued .pitem,html.lite .hero-box{background-color:color-mix(in srgb,var(--cardbg,#fff) 100%,transparent)}
html.lite .card::before,html.lite .card::after,html.lite #drawer::before,html.lite #drawer::after{animation:none!important}
html.lite .card:not(.hero){box-shadow:0 4px 14px rgba(0,0,0,.12)!important}
html.lite .spk{will-change:transform,opacity}
html.scrolling #pvbg *,html.scrolling .card::before,html.scrolling .card::after,html.hiddenTab *{animation-play-state:paused!important}
html.still *,html.still *::before,html.still *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
html.lite #pvbg .g{filter:none!important}
html.lite #pvbg .tint{mix-blend-mode:normal!important;opacity:.45;animation:tintMove 40s ease-in-out infinite alternate!important}
html.lite #pvbg .st,html.lite #pvbg .meteor{filter:none!important}
html.lite #pvbg .st.s1,html.lite #pvbg .st.s6{display:none}
html.lite #pvbg .cl{filter:blur(8px)}

7797855],"geo":"verified","desc":"Nhà thờ Đức Bà là một trong những công trình kiến trúc nổi tiếng và biểu tượng lâu đời của TP. Hồ Chí Minh. Được xây dựng vào cuối thế kỷ XIX, nhà thờ gây ấn tượng với phong cách kiến trúc Roman kết hợp Gothic, hai tháp chuông cao và vẻ đẹp cổ kính. Đây là điểm tham quan thu hút đông đảo du khách, đặc biệt là những người yêu thích lịch sử, kiến trúc và nhiếp ảnh.","hours":["Đang đóng cửa để sửa chữa – có thể tham quan, chụp ảnh bên ngoài"],"price":["Miễn phí"],"price_level":0,"visit_min":20,"highlights":[],"warning":"Đang trùng tu","source":"https://vi.wikipedia.org/wiki/Nh%C3%A0_th%E1%BB%9D_ch%C3%ADnh_t%C3%B2a_%C4%90%E1%BB%A9c_B%C3%A0_S%C3%A0i_G%C3%B2n","source_name":"Wikipedia","maps_url":"https://www.google.com/maps/place/Nh%C3%A0+th%E1%BB%9D+%C4%90%E1%BB%A9c+B%C3%A0+S%C3%A0i+G%C3%B2n,+01+C%C3%B4ng+tr%C6%B0%E1%BB%9Dng+C%C3%B4ng+x%C3%A3+Paris,+Qu%E1%BA%ADn+1,+H%E1%BB%93+Ch%C3%AD+Minh+70000,+Vi%E1%BB%87t+Nam/@10.7797855,106.6990189,16z/data=!4m6!3m5!1s0x31752f37e6d82451:0xe84f59936ced5b45!8m2!3d10.7797855!4d106.6990189!16s/m/027b16m?hl=vi&g_ep=Eg1tbF8yMDI2MTEwM18wIJvbDyoASAJQAg==","updated":"11/2026","name_en":"Notre-Dame Cathedral Basilica of Saigon","desc_en":"Notre-Dame Cathedral is one of the most famous and long-standing landmarks of Ho Chi Minh City. Built in the late 19th century, it impresses with its Romanesque–Gothic style, two tall bell towers and timeless beauty, attracting crowds of visitors – especially lovers of history, architecture and photography.","hours_en":["Closed for restoration – you can still visit and take photos outside"],"price_en":["Free"]},{"id":"h7","name":"Đường sách Nguyễn Văn Bình","cats":["history","checkin","shopping"],"kind":"Di tích – Văn hóa","address":"QMJX+6WG, Đ. Nguyễn Văn Bình, Sài Gòn, Hồ Chí Minh","coords":[106.6998246,10.7805644],"geo":"verified","desc":"Đường sách Nguyễn Văn Bình là không gian văn hóa đọc nổi tiếng nằm ngay trung tâm TP. Hồ Chí Minh. Nơi đây tập trung nhiều gian hàng sách với đa dạng thể loại, từ văn học, lịch sử đến sách thiếu nhi và ngoại ngữ. Bên cạnh việc mua và đọc sách, du khách còn có thể tham gia các hoạt động giao lưu, triển lãm, thưởng thức cà phê và tận hưởng không gian yên bình giữa lòng thành phố.","hours":["Thứ Hai – Thứ Sáu: 8h00 – 21h00 (có gian đến 22h00)","Thứ Bảy, Chủ Nhật: 8h00 – 21h30/22h00"],"price":["Miễn phí"],"price_level":0,"visit_min":45,"highlights":[],"warning":null,"source":"https://vinwonders.com/vi/wonderpedia/news/duong-sach-nguyen-van-binh-sai-gon/","source_name":"Nguồn tham khảo","maps_url":"https://www.google.com/maps/place/QMJX+6WG+%C4%90%C6%B0%E1%BB%9Dng+s%C3%A1ch+Nguy%E1%BB%85n+V%C4%83n+B%C3%ACnh,+%C4%90.+Nguy%E1%BB%85n+V%C4%83n+B%C3%ACnh,+S%C3%A0i+G%C3%B2n,+H%E1%BB%93+Ch%C3%AD+Minh,+Vi%E1%BB%87t+Nam/@10.7805644,106.6998246,17z/data=!4m6!3m5!1s0x31752f005120feb3:0xc554a352449a2334!8m2!3d10.7805644!4d106.6998246!16s/g/11y59yx5kg?hl=vi&g_ep=Eg1tbF8yMDI2MTEwM18wIJvbDyoASAJQAg==","updated":"11/2026","name_en":"Nguyễn Văn Bình Book Street","desc_en":"Nguyễn Văn Bình Book Street is a well-known reading space right in the city centre, with many book stalls covering literature, history, children's books and foreign languages. Besides buying and reading books, visitors can join talks and exhibitions, enjoy coffee and a peaceful corner in the heart of the city.","hours_en":["Monday – Friday: 8:00 – 21:00 (some stalls until 22:00)","Saturday, Sunday: 8:00 – 21:30/22:00"],"price_en":["Free"]},{"id":"h8","name":"Bảo tàng Chứng tích Chiến tranh","cats":["history"],"kind":"Di tích – Văn hóa","address":"Số 28 Võ Văn Tần, Phường Xuân Hòa, TP. Hồ Chí Minh","coords":[106.6920916,10.7795106],"geo":"verified","desc":"Bảo tàng Chứng tích Chiến tranh là một trong những địa điểm văn hóa, lịch sử tiêu biểu của TP. Hồ Chí Minh. Nơi đây lưu giữ và trưng bày nhiều hình ảnh, tư liệu, hiện vật về các cuộc chiến tranh tại Việt Nam, giúp du khách hiểu rõ hơn về những mất mát, hậu quả của chiến tranh cũng như giá trị của hòa bình.","hours":["7h30 – 17h30 mỗi ngày, kể cả ngày lễ"],"price":["Vé phổ thông: 60.000đ","Giảm 50%: 30.000đ (người cao tuổi, người khuyết tật, …)","Miễn phí: học sinh, sinh viên, trẻ dưới 6 tuổi (đăng ký vé trực tuyến)"],"price_level":1,"visit_min":90,"highlights":[],"warning":null,"source":"https://vi.wikipedia.org/wiki/B%E1%BA%A3o_t%C3%A0ng_Ch%E1%BB%A9ng_t%C3%ADch_chi%E1%BA%BFn_tranh","source_name":"Wikipedia","maps_url":"https://www.google.com/maps/place/B%E1%BA%A3o+t%C3%A0ng+Ch%E1%BB%A9ng+t%C3%ADch+Chi%E1%BA%BFn+tranh/@10.7795159,106.6895167,17z/data=!3m1!4b1!4m6!3m5!1s0x31752f30a23708cf:0x7cd94adf2b1474aa!8m2!3d10.7795106!4d106.6920916!16s%2Fm%2F02pt71k?hl=vi&entry=ttu&g_ep=EgoyMDI2MTEwMy4wIKXMDSoASAFQAw%3D%3D","updated":"11/2026","name_en":"War Remnants Museum","desc_en":"The War Remnants Museum is one of the city's key cultural and historical sites. It keeps and displays photos, documents and artefacts about the wars in Vietnam, helping visitors understand the losses and consequences of war as well as the value of peace.","hours_en":["7:30 – 17:30 every day, including holidays"],"price_en":["Standard ticket: 60,000đ","50% off: 30,000đ (seniors, people with disabilities, …)","Free: pupils, students, children under 6 (register online)"]},{"id":"h9","name":"Chùa Vĩnh Nghiêm","cats":["history","nature"],"kind":"Di tích – Văn hóa","address":"339 Nam Kỳ Khởi Nghĩa, Phường Xuân Hòa, TP. Hồ Chí Minh","coords":[106.6822801,10.79039],"geo":"verified","desc":"Chùa Vĩnh Nghiêm là một trong những ngôi chùa nổi tiếng tại TP. Hồ Chí Minh, được xây dựng theo kiến trúc Phật giáo truyền thống kết hợp với nét hiện đại. Ngôi chùa gây ấn tượng bởi khuôn viên rộng rãi, tháp đá cao và không gian thanh tịnh. Đây là điểm đến phù hợp cho du khách muốn tìm hiểu văn hóa Phật giáo và trải nghiệm không gian tâm linh giữa lòng thành phố.","hours":["Thứ Hai – Thứ Bảy: 6h00 – 19h00 (điện chính khoảng 7h00 – 19h00)","Chủ Nhật: 6h00 – 23h00 (dịp lễ có thể muộn hơn)"],"price":["Miễn phí"],"price_level":0,"visit_min":45,"highlights":[],"warning":null,"source":"https://vi.wikipedia.org/wiki/Ch%C3%B9a_V%C4%A9nh_Nghi%C3%AAm_\\(Th%C3%A0nh_ph%E1%BB%91_H%E1%BB%93_Ch%C3%AD_Minh\\\\","source_name":"Wikipedia","maps_url":"https://www.google.com/maps/place/Ch%C3%B9a+V%C4%A9nh+Nghi%C3%AAm/@10.7903953,106.6797052,17z/data=!3m1!4b1!4m6!3m5!1s0x317528d3506b13d1:0x3ecdcb36938e8802!8m2!3d10.79039!4d106.6822801!16s%2Fm%2F02px8sc?hl=vi&entry=ttu&g_ep=EgoyMDI2MTEwMy4wIKXMDSoASAFQAw%3D%3D","updated":"11/2026","name_en":"Vĩnh Nghiêm Pagoda","desc_en":"Vĩnh Nghiêm Pagoda is one of the best-known pagodas in Ho Chi Minh City, built in traditional Buddhist style with modern touches. It impresses with its spacious grounds, tall stone tower and serene atmosphere – a good place to learn about Buddhist culture and find calm in the middle of the city.","hours_en":["Monday – Saturday: 6:00 – 19:00 (main hall about 7:00 – 19:00)","Sunday: 6:00 – 23:00 (may be later on festival days)"],"price_en":["Free"]},{"id":"h10","name":"Nhà thờ Tân Định","cats":["history","checkin"],"kind":"Di tích – Văn hóa","address":"289 Hai Bà Trưng, Phường Xuân Hòa, TP. Hồ Chí Minh","coords":[106.6906789,10.7883359],"geo":"verified","desc":"Nhà thờ Tân Định là công trình tôn giáo nổi bật với màu hồng đặc trưng, được xây dựng từ cuối thế kỷ XIX. Nhà thờ mang phong cách kiến trúc Gothic kết hợp với những chi tiết trang trí tinh xảo, tạo nên vẻ đẹp độc đáo và thu hút. Đây là một trong những địa điểm check-in nổi tiếng, được nhiều du khách trong và ngoài nước yêu thích.","hours":["Thứ Hai – Thứ Sáu: 7h00–12h00, 14h00–17h00, 20h00–21h00 (không tham quan trong giờ lễ)","Thứ Bảy: không tham quan từ 12h00","Chủ Nhật: không tham quan"],"price":["Miễn phí"],"price_level":0,"visit_min":30,"highlights":[],"warning":null,"source":"https://vi.wikipedia.org/wiki/Nh%C3%A0_th%E1%BB%9D_T%C3%A2n_%C4%90%E1%BB%8Bnh","source_name":"Wikipedia","maps_url":"https://www.google.com/maps/place/Nh%C3%A0+Th%E1%BB%9D+Gi%C3%A1o+X%E1%BB%A9+T%C3%A2n+%C4%90%E1%BB%8Bnh/@10.7883412,106.688104,17z/data=!3m1!4b1!4m6!3m5!1s0x31752f3320a1f467:0x78bb00536c22b982!8m2!3d10.7883359!4d106.6906789!16s%2Fm%2F02pywq7?hl=vi&entry=ttu&g_ep=EgoyMDI2MTEwMy4wIKXMDSoASAFQAw%3D%3D","updated":"11/2026","name_en":"Tân Định Church","desc_en":"Tân Định Church is a striking pink church built in the late 19th century. Its Gothic style with delicate decorations makes it uniquely beautiful and one of the most popular photo spots for both Vietnamese and international visitors.","hours_en":["Monday – Friday: 7:00–12:00, 14:00–17:00, 20:00–21:00 (no visits during Mass)","Saturday: no visits after 12:00","Sunday: no visits"],"price_en":["Free"]},{"id":"h11","name":"Trường THPT Lê Quý Đôn","cats":["history","checkin"],"kind":"Di tích – Văn hóa","address":"110 Nguyễn Thị Minh Khai, Phường Xuân Hòa, TP. Hồ Chí Minh","coords":[106.6945111,10.7792688],"geo":"verified","desc":"Trường THPT Lê Quý Đôn là một trong những ngôi trường lâu đời nhất tại TP. Hồ Chí Minh, được xây dựng từ năm 1874. Ngôi trường nổi bật với kiến trúc Pháp cổ kính, mang vẻ đẹp hài hòa giữa nét cổ điển và không gian xanh. Không chỉ là một cơ sở giáo dục có bề dày lịch sử, nơi đây còn là công trình kiến trúc mang giá trị văn hóa và dấu ấn đặc biệt của thành phố.","hours":["Tham quan sau giờ học (giờ học 6h00 – 16h00, Thứ Hai – Thứ Sáu)"],"price":["Miễn phí"],"price_level":0,"visit_min":20,"highlights":[],"warning":null,"source":"https://vi.wikipedia.org/wiki/Tr%C6%B0%E1%BB%9Dng_Trung_h%E1%BB%8Dc_ph%E1%BB%95_th%C3%B4ng_L%C3%AA_Qu%C3%BD_%C4%90%C3%B4n,_Th%C3%A0nh_ph%E1%BB%91_H%E1%BB%93_Ch%C3%AD_Minh","source_name":"Wikipedia","maps_url":"https://www.google.com/maps/place/Tr%C6%B0%E1%BB%9Dng+THPT+L%C3%AA+Qu%C3%BD+%C4%90%C3%B4n/@10.7792741,106.6919362,17z/data=!3m1!4b1!4m6!3m5!1s0x31752f374b62df97:0x228a380e9268115b!8m2!3d10.7792688!4d106.6945111!16s%2Fg%2F122_y4dj?hl=vi&entry=ttu&g_ep=EgoyMDI2MTEwMy4wIKXMDSoASAFQAw%3D%3D","updated":"11/2026","name_en":"Lê Quý Đôn High School","desc_en":"Lê Quý Đôn High School, founded in 1874, is one of the oldest schools in Ho Chi Minh City. Its old French architecture blends classic charm with green spaces. More than a school with a long history, it is also a building of cultural value and a special landmark of the city.","hours_en":["Visits after school hours (classes 6:00 – 16:00, Monday – Friday)"],"price_en":["Free"]},{"id":"h12","name":"Nhà thờ Dòng Chúa Cứu Thế (Kỳ Đồng)","cats":["history"],"kind":"Di tích – Văn hóa","address":"38 Đ. Kỳ Đồng, Phường Nhiêu Lộc, TP. Hồ Chí Minh","coords":[106.6809903,10.7816111],"geo":"verified","desc":"Nhà thờ Dòng Chúa Cứu Thế, còn được biết đến với tên gọi Nhà thờ Kỳ Đồng, là công trình tôn giáo nổi tiếng tại TP. Hồ Chí Minh, được khánh thành vào năm 1952. Nhà thờ gây ấn tượng với kiến trúc trang nghiêm, không gian rộng rãi và là trung tâm hành hương kính Đức Mẹ Hằng Cứu Giúp của nhiều giáo dân. Đây là điểm đến thích hợp cho du khách muốn tìm hiểu về đời sống tín ngưỡng và văn hóa Công giáo tại thành phố.","hours":["Mở cửa trong ngày cho giáo dân và khách tham quan","Thánh lễ ngày thường: 5h00, 6h00, 18h00","Hành hương Đức Mẹ Hằng Cứu Giúp: Thứ Tư hằng tuần"],"price":["Miễn phí"],"price_level":0,"visit_min":30,"highlights":[],"warning":null,"source":"https://vi.wikipedia.org/wiki/Nh%C3%A0_th%E1%BB%9D_D%C3%B2ng_Ch%C3%BAa_C%E1%BB%A9u_Th%E1%BA%BF_S%C3%A0i_G%C3%B2n","source_name":"Wikipedia","maps_url":"https://www.google.com/maps/place/Nh%C3%A0+th%E1%BB%9D+D%C3%B2ng+Ch%C3%BAa+C%E1%BB%A9u+Th%E1%BA%BF+%7C+%C4%90%E1%BB%81n+%C4%90%E1%BB%A9c+M%E1%BA%B9+H%E1%BA%B1ng+C%E1%BB%A9u+Gi%C3%BAp/@10.7816164,106.6784154,17z/data=!3m1!4b1!4m6!3m5!1s0x31752f28dbfb041d:0xde3f52fc2b9f2309!8m2!3d10.7816111!4d106.6809903!16s%2Fg%2F11flt8wcmm?hl=vi&entry=ttu&g_ep=EgoyMDI2MTEwMy4wIKXMDSoASAFQAw%3D%3D","updated":"11/2026","name_en":"Redemptorist Church (Kỳ Đồng Church)","desc_en":"The Redemptorist Church, also known as Kỳ Đồng Church, is a well-known church inaugurated in 1952. It impres
