/* ===== Personavel – live weather for each place (Open-Meteo, no key), screen effects + guide advice ===== */
(function(){
'use strict';
const {$, $$, esc, state} = PV;
const S = () => (state.settings.weather = Object.assign({on:true, sim:'real'}, state.settings.weather || {}));

/* ---------- data ---------- */
const cache = {};
const KIND = c => c === 0 || c === 1 ? 'clear' : c === 2 || c === 3 ? 'cloudy' : c === 45 || c === 48 ? 'fog' : (c >= 51 && c <= 57) ? 'drizzle'
  : (c >= 61 && c <= 67) || (c >= 80 && c <= 82) ? 'rain' : c >= 95 ? 'storm' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'cloudy' : 'cloudy';
const DESC = {
  clear:['Trời quang, nắng','Clear and sunny'], clearN:['Trời quang','Clear night'], cloudy:['Nhiều mây','Cloudy'], partly:['Có mây, nắng nhẹ','Partly cloudy'],
  fog:['Sương mù','Foggy'], drizzle:['Mưa phùn','Drizzle'], rain:['Đang mưa','Raining'], heavy:['Mưa to','Heavy rain'], storm:['Mưa dông, có sấm sét','Thunderstorm']
};
const SIM = {
  rain:   {code:63, temp:27, feels:30, hum:92, wind:14, uv:1, rain:4.2, isDay:1},
  storm:  {code:95, temp:26, feels:29, hum:94, wind:28, uv:0, rain:9.5, isDay:1},
  sun:    {code:0,  temp:35, feels:40, hum:55, wind:8,  uv:10, rain:0, isDay:1},
  cloudy: {code:3,  temp:30, feels:33, hum:72, wind:10, uv:3, rain:0, isDay:1},
  fog:    {code:45, temp:24, feels:25, hum:97, wind:4,  uv:1, rain:0, isDay:1},
  night:  {code:0,  temp:27, feels:29, hum:80, wind:6,  uv:0, rain:0, isDay:0}
};
function norm(w){
  let kind = KIND(w.code), key = kind;
  if (kind === 'clear' && !w.isDay) key = 'clearN';
  if (kind === 'clear' && w.code === 1 && w.isDay) key = 'partly';
  if (kind === 'rain' && (w.rain >= 7 || w.code === 65 || w.code === 82)) key = 'heavy';
  return {...w, kind, desc: PV.L(...DESC[key])};
}
PV.getWeather = async (lat, lon) => {
  const s = S();
  if (s.sim && s.sim !== 'real' && SIM[s.sim]) return norm(SIM[s.sim]);
  const k = lat.toFixed(2) + ',' + lon.toFixed(2);
  if (cache[k] && Date.now() - cache[k].t < 10*60e3) return cache[k].w;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,rain,showers,weather_code,wind_speed_10m,uv_index,is_day&timezone=Asia%2FBangkok`;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 7000);
  try {
    const r = await fetch(url, {signal: ctl.signal}); const j = await r.json(); const c = j.current;
    const w = norm({code:c.weather_code, temp:c.temperature_2m, feels:c.apparent_temperature, hum:c.relative_humidity_2m, wind:c.wind_speed_10m, uv:c.uv_index ?? 0, rain:(c.rain||0)+(c.showers||0)+0, isDay:c.is_day});
    cache[k] = {t: Date.now(), w}; return w;
  } finally { clearTimeout(to); }
};

const uvLevel = u => u >= 11 ? [PV.L('Cực cao','Extreme'),'#8E3BB8'] : u >= 8 ? [PV.L('Rất cao','Very high'),'#D7263D'] : u >= 6 ? [PV.L('Cao','High'),'#F46036'] : u >= 3 ? [PV.L('Trung bình','Moderate'),'#E8B11C'] : [PV.L('Thấp','Low'),'#2E9E6E'];
const ICONS = {clear:'☀️', clearN:'🌙', partly:'🌤️', cloudy:'☁️', fog:'🌫️', drizzle:'🌦️', rain:'🌧️', heavy:'🌧️', storm:'⛈️'};
const icon = w => w.kind === 'clear' ? (w.isDay ? (w.code === 1 ? ICONS.partly : ICONS.clear) : ICONS.clearN) : ICONS[w.kind] || '🌤️';

/* advice the guide gives */
function advice(w, place){
  const n = esc(place), tips = [];
  if (w.kind === 'storm') tips.push(PV.L(`Ở ${n} đang có dông sét ⛈️ Bạn nên tạm trú trong nhà, tránh đứng dưới cây to hoặc chỗ trống trải, đợi trời ngớt rồi hãy đi tiếp nhé.`, `There's a thunderstorm at ${n} ⛈️ Please shelter indoors, stay away from big trees and open spaces, and wait for it to pass.`));
  else if (w.kind === 'rain') tips.push(PV.L(`${n} đang mưa ☔ Nhớ mang dù hoặc áo mưa, đi chậm vì đường trơn, và cất điện thoại vào túi chống nước nha.`, `It's raining at ${n} ☔ Bring an umbrella or raincoat, ride slowly on wet roads and keep your phone dry.`));
  else if (w.kind === 'drizzle') tips.push(PV.L(`${n} đang mưa phùn lất phất 🌦️ Mang theo dù nhỏ hoặc áo khoác mỏng là đủ.`, `Light drizzle at ${n} 🌦️ A small umbrella or light jacket will do.`));
  else if (w.kind === 'fog') tips.push(PV.L(`${n} đang có sương mù 🌫️ Tầm nhìn hạn chế, đi xe nhớ bật đèn và chạy chậm.`, `Fog at ${n} 🌫️ Visibility is low — turn on your lights and go slowly.`));
  if (w.isDay && w.uv >= 8) tips.push(PV.L(`Nắng gắt, chỉ số UV ${Math.round(w.uv)} (rất cao) 🥵 Hãy bôi kem chống nắng SPF 50, đội nón rộng vành, đeo kính râm và mặc áo khoác chống nắng.`, `Harsh sun, UV ${Math.round(w.uv)} (very high) 🥵 Use SPF 50 sunscreen, a wide hat, sunglasses and a sun jacket.`));
  else if (w.isDay && w.uv >= 6) tips.push(PV.L(`UV ${Math.round(w.uv)} (cao) 😎 Nhớ bôi kem chống nắng và đội nón khi ra ngoài.`, `UV ${Math.round(w.uv)} (high) 😎 Wear sunscreen and a hat outdoors.`));
  else if (w.isDay && w.uv >= 3 && w.kind !== 'rain' && w.kind !== 'storm') tips.push(PV.L(`UV ${Math.round(w.uv)} ở mức trung bình, vẫn nên bôi chút kem chống nắng nhé.`, `UV ${Math.round(w.uv)} is moderate — a bit of sunscreen is still a good idea.`));
  if (w.feels >= 38) tips.push(PV.L(`Nhiệt độ cảm nhận ${Math.round(w.feels)}°C, rất oi bức 🔥 Uống nhiều nước, nghỉ trong bóng râm giữa các điểm tham quan.`, `Feels like ${Math.round(w.feels)}°C 🔥 Drink plenty of water and rest in the shade between stops.`));
  else if (w.feels >= 34 && !tips.length) tips.push(PV.L(`Trời khá nóng (${Math.round(w.feels)}°C) – nhớ mang theo nước uống nhé.`, `It's hot (${Math.round(w.feels)}°C) – carry some water.`));
  if (w.wind >= 30) tips.push(PV.L(`Gió mạnh ${Math.round(w.wind)} km/h 💨 Cẩn thận khi đi xe máy và giữ chặt đồ đạc.`, `Strong wind ${Math.round(w.wind)} km/h 💨 Take care on a motorbike and hold on to your things.`));
  if (!tips.length){
    if (!w.isDay) tips.push(PV.L(`Buổi tối ở ${n} trời dễ chịu 🌙 Rất hợp để dạo phố và ngắm đèn đêm.`, `A pleasant evening at ${n} 🌙 Great for a night walk.`));
    else if (w.kind === 'cloudy') tips.push(PV.L(`${n} trời nhiều mây, mát mẻ ☁️ Thời tiết lý tưởng để đi bộ khám phá đấy!`, `Cloudy and cool at ${n} ☁️ Perfect weather for walking around!`));
    else tips.push(PV.L(`Thời tiết ở ${n} đang đẹp 🌤️ Chúc bạn có chuyến tham quan vui vẻ!`, `Lovely weather at ${n} 🌤️ Enjoy your visit!`));
  }
  return tips;
}

/* ---------- full-screen effects ---------- */
let fxTimer = null;
PV.weatherFX = (w) => {
  const old = $('#wxfx'); if (old) old.remove(); clearTimeout(fxTimer);
  if (document.body.classList.contains('reduce')) return;
  const R = (a,b) => a + Math.random()*(b-a);
  let html = '', cls = '';
  if (w.kind === 'rain' || w.kind === 'storm' || w.kind === 'drizzle'){
    const n = w.kind === 'drizzle' ? 70 : w.kind === 'storm' ? 190 : 140;
    cls = 'wx-rain' + (w.kind === 'drizzle' ? ' light' : '');
    html += Array.from({length:n}, () => `<i class="drop" style="left:${R(-5,105).toFixed(1)}%;animation-delay:-${R(0,1.2).toFixed(2)}s;animation-duration:${R(.45,.85).toFixed(2)}s;opacity:${R(.35,.85).toFixed(2)};height:${R(14,30)|0}px"></i>`).join('');
    html += Array.from({length:16}, () => `<i class="splash" style="left:${R(2,98).toFixed(1)}%;animation-delay:-${R(0,1).toFixed(2)}s"></i>`).join('');
    if (w.kind === 'storm'){ cls += ' wx-storm'; html += '<i class="flash"></i><svg class="bolt" viewBox="0 0 60 160"><path d="M34 0L6 86h20L14 160 54 60H32L46 0z"/></svg>'; }
  } else if (w.kind === 'clear' && w.isDay){
    cls = 'wx-sun' + (w.uv >= 8 ? ' harsh' : '');
    html = '<i class="glare"></i><i class="rays"></i><i class="haze"></i>';
  } else if (w.kind === 'cloudy' || (w.kind === 'clear' && w.code === 1)){
    cls = 'wx-cloud';
    html = Array.from({length:6}, (_,i) => `<i class="cloud" style="top:${(4+i*13+R(-3,3)).toFixed(1)}%;animation-delay:-${R(0,40).toFixed(1)}s;animation-duration:${R(38,60).toFixed(1)}s;transform:scale(${R(.7,1.3).toFixed(2)})"></i>`).join('');
  } else if (w.kind === 'fog'){
    cls = 'wx-fog'; html = '<i class="mist m1"></i><i class="mist m2"></i><i class="mist m3"></i>';
  } else if (!w.isDay){
    cls = 'wx-night'; html = Array.from({length:30}, () => `<i class="tw" style="left:${R(2,98).toFixed(1)}%;top:${R(2,45).toFixed(1)}%;animation-delay:-${R(0,3).toFixed(2)}s"></i>`).join('');
  }
  if (!html) return;
  const fx = document.createElement('div'); fx.id = 'wxfx'; fx.className = 'wxfx ' + cls; fx.setAttribute('aria-hidden','true'); fx.innerHTML = html;
  document.body.appendChild(fx);
  fxTimer = setTimeout(() => { fx.classList.add('out'); setTimeout(() => fx.remove(), 1200); }, 9000);
};

/* ---------- the guide pops up with advice ---------- */

    ['👘', L('Nhà thờ màu hồng là “phông nền quốc dân” – áo dài trắng, hồng pastel hoặc xanh nhạt lên ảnh rất xinh.', 'The pink church is an iconic backdrop – white, pastel-pink or light-blue áo dài look lovely.')]],
  h6: () => [
    ['🏗️', L('Nhà thờ có thể đang trùng tu, một phần bị che chắn – chụp từ quảng trường phía trước là đẹp nhất.', 'The cathedral may be under restoration and partly covered – the square in front gives the best shot.')]],
};

function base(p){
  const n = N(p), out = [];
  const church = /nha tho/.test(n), pagoda = /chua |^chua|den |mieu/.test(n+' '), museum = /bao tang/.test(n);
  if (church) {
    out.push(['👔', L('Ăn mặc kín đáo, lịch sự (che vai, váy/quần qua gối) khi vào nhà thờ.', 'Dress modestly (covered shoulders, knee-length) inside the church.')]);
    out.push(['🤫', L('Giữ trật tự, không chụp ảnh và đi lại trong giờ lễ.', 'Keep quiet and don’t take photos or walk around during Mass.')]);
  }
  if (pagoda) {
    out.push(['👔', L('Ăn mặc kín đáo; cởi giày dép trước khi vào chánh điện.', 'Dress modestly and take off your shoes before entering the main hall.')]);
    out.push(['🙏', L('Nói nhỏ, không chỉ tay vào tượng Phật, xin phép trước khi chụp người đang lễ.', 'Speak softly, don’t point at Buddha statues, and ask before photographing worshippers.')]);
  }
  if (museum) {
    out.push(['📷', L('Không dùng đèn flash và không chạm vào hiện vật.', 'No flash photography and don’t touch the exhibits.')]);
    out.push(['🎒', L('Có thể phải gửi balo lớn ở quầy – mang theo túi nhỏ cho tiện.', 'Large backpacks may need to be checked in – a small bag is easier.')]);
  }
  if (has(p,'history') && !church && !pagoda && !museum && !SPECIAL[p.id])
    out.push(['👔', L('Đây là di tích – nên ăn mặc lịch sự, giữ gìn cảnh quan.', 'This is a heritage site – dress neatly and keep it clean.')]);
  if (has(p,'checkin'))
    out.push(['👘', L('Điểm check-in đẹp, hợp phong cách áo dài – có thể mang theo áo dài để chụp ảnh.', 'A great photo spot that suits áo dài – consider bringing one for pictures.')]);
  if (has(p,'checkin') || (has(p,'history') && !museum))
    out.push(['⏰', L('Ánh sáng đẹp nhất khoảng 7–9h sáng hoặc 16–17h30 chiều, lúc này cũng đỡ đông.', 'Best light is around 7–9 am or 4–5:30 pm, which is also less crowded.')]);
  if (has(p,'shopping') && p.id !== 's6') {
    out.push(['💳', L('Hỏi giá trước; nhiều cửa hàng nhận thẻ/QR nhưng vẫn nên mang ít tiền mặt.', 'Check prices first; many shops take cards/QR but carry some cash.')]);
    if (/dac san|nutty|marou|langfarm|legumes|mart/.test(n)) out.push(['🏷️', L('Đồ ăn làm quà: xem kỹ hạn sử dụng và cách bảo quản khi mang đi xa.', 'Food gifts: check the expiry date and storage if travelling far.')]);
  }
  if (has(p,'food')) {
    const ft = PV.foodType ? PV.foodType(p) : 'meal';
    out.push(['⏳', ft==='snack'
      ? L('Quán ăn vặt thường đông buổi chiều tối – đến sớm một chút để có chỗ ngồi.', 'Snack spots get busy late afternoon/evening – come a bit early for a seat.')
      : L('Giờ cao điểm (11h30–13h, 18–19h30) thường phải chờ – nên đến sớm hoặc lệch giờ.', 'Peak hours (11:30–13:00, 18:00–19:30) mean queues – come early or off-peak.')]);
    if (/oc |^oc|bach tuoc|hai san/.test(n+' ')) out.push(['💬', L('Hải sản/ốc tính theo dĩa hoặc ký – hỏi giá trước khi gọi món.', 'Seafood/snails are priced per plate or kilo – ask before ordering.')]);
    out.push(['💵', L('Quán bình dân nên mang tiền mặt mệnh giá nhỏ hoặc hỏi trước có nhận chuyển khoản không.', 'Street eateries prefer small cash – ask first if they take bank transfer.')]);
  }
  return out;
}

PV.placeTips = (p) => {
  if (!p) return [];
  const sp = SPECIAL[p.id] ? SPECIAL[p.id]() : [];
  const seen = new Set(), res = [];
  [...sp, ...base(p)].forEach(t => { const k = t[0]; if (k==='👘' && seen.has('👘')) return; if (k==='👔' && seen.has('👔')) return; seen.add(k); res.push(t); });
  if (p.warning) res.unshift(['⚠️', esc(p.warning)]);
  return res.slice(0, 6);
};

const outdoor = (p) => has(p,'checkin') || has(p,'nature') || (has(p,'history') && !/bao tang|nha hat/.test(N(p))) || /pho am thuc|vỉa hè|via he|xe lam/.test(N(p));
PV.weatherPlaceTips = (w, p) => {
  const t = [];
  if (!w) return t;
  if (w.kind === 'storm') t.push(['⛈️', L('Hôm nay có dông – ưu tiên điểm trong nhà, tránh đứng dưới cây lớn.', 'Thunderstorms today – favour indoor spots and avoid standing under big trees.')]);
  else if (w.kind === 'rain' || w.kind === 'heavy') t.push(['☔', outdoor(p) ? L('Hôm nay trời mưa – nhớ mang dù/áo mưa; ảnh check-in nên đợi tạnh mưa.', 'It’s raining today – bring an umbrella/raincoat; wait for a break for photos.') : L('Trời mưa nhưng đây là điểm trong nhà – lựa chọn rất hợp hôm nay, vẫn nhớ mang dù khi di chuyển.', 'Rainy, but this is indoors – a good pick today; still bring an umbrella for the trip.')]);
  else if (w.kind === 'drizzle') t.push(['🌂', L('Có mưa phùn – mang theo dù nhỏ cho chắc.', 'Light drizzle – a small umbrella is handy.')]);
  if (w.isDay && w.uv >= 6 && outdoor(p)) t.push(['🧴', L(`Nắng gắt (UV ${Math.round(w.uv)}) – bôi kem chống nắng, đội nón, mang nước; áo dài nên chọn vải thoáng.`, `Strong sun (UV ${Math.round(w.uv)}) – sunscreen, a hat and water; choose a breathable áo dài.`)]);
  else if (w.feels >= 35) t.push(['💧', L(`Trời nóng (${Math.round(w.feels)}°C) – mang theo nước uống.`, `It’s hot (${Math.round(w.feels)}°C) – carry water.`)]);
  return t;
};

const li = (t, cls='') => `<li class="${cls}"><span class="ti">${t[0]}</span><span>${t[1]}</span></li>`;
const _open = PV.openPlace;
PV.openPlace = (id, opt) => {
  const r = _open(id, opt);
  const p = PV.byId(id), dr = document.getElementById('drawer'); if (!p || !dr) return r;
  const body = dr.querySelector('.body'); if (!body || body.querySelector('.tipbox')) return r;
  const tips = PV.placeTips(p); if (!tips.length) return r;

  const kv = body.querySelector('.kv'); if (kv) kv.insertAdjacentHTML('beforebegin', html); else body.insertAdjacentHTML('beforeend', html);

/* chatbot: "đi X cần lưu ý gì / mặc gì / mang gì" */
const _la = PV.localAnswer;
PV.localAnswer = (text) => {
  const n = PV.norm(text);

/* ===== Personavel – prettier map styles (Google-like, Apple-like, pastel, night, satellite) ===== */
(function(){
'use strict';
const {$, $$, state} = PV;
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const ATT = 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors';
const T = (path, o={}) => ({url: ESRI + path + '/MapServer/tile/{z}/{y}/{x}', o: Object.assign({maxZoom:19, attribution:ATT}, o)});
const STYLES = {
  google: {vi:'Tươi sáng', en:'Vivid', sub:['kiểu Google Maps','Google-like'], layers:[T('World_Street_Map')], filter:'saturate(1.28) contrast(1.05) brightness(1.02)', thumb:'linear-gradient(135deg,#F2EFE9 0 40%,#FBD27A 40% 46%,#F2EFE9 46% 62%,#AAD3F5 62%)'},
  apple:  {vi:'Dịu nhẹ', en:'Soft', sub:['kiểu Apple Maps','Apple-like'], layers:[T('World_Street_Map')], filter:'saturate(.78) brightness(1.07) contrast(.93) sepia(.06)', thumb:'linear-gradient(135deg,#F7F5F0 0 40%,#FFFFFF 40% 46%,#F7F5F0 46% 62%,#BFDDF2 62%)'},
  pastel: {vi:'Pastel theo nền', en:'Pastel (theme)', sub:['hợp màu trang','matches page'], layers:[T('World_Street_Map')], filter:'tint', tint:true, thumb:'linear-gradient(135deg,var(--baby,#E6F1FB) 0 40%,#fff 40% 46%,var(--baby,#E6F1FB) 46% 62%,var(--pastel,#C9DDF2) 62%)'},
  dark:   {vi:'Ban đêm', en:'Night', sub:['nền tối','dark'], layers:[T('Canvas/World_Dark_Gray_Base',{maxNativeZoom:16}), T('Canvas/World_Dark_Gray_Reference',{maxNativeZoom:16})], filter:'tintdark', thumb:'linear-gradient(135deg,#2B2D33 0 40%,#4A4D57 40% 46%,#2B2D33 46% 62%,#1C2330 62%)'},
  sat:    {vi:'Vệ tinh', en:'Satellite', sub:['ảnh thật','imagery'], layers:[T('World_Imagery'), T('Reference/World_Transportation',{opacity:.55}), T('Reference/World_Boundaries_and_Places')], filter:'saturate(1.1) contrast(1.04)', thumb:'linear-gradient(135deg,#3E5A3A 0 30%,#6B7F55 30% 55%,#2F4A5E 55%)'}
};
const ORDER = ['auto','google','apple','pastel','dark','sat'];
const pick = () => {
  const s = (state.settings.mapStyle || 'auto');
  if (s !== 'auto' && STYLES[s]) return s;
  return document.body.classList.contains('hued') ? 'pastel' : 'google';   // always a light map
};
const filterFor = (k) => {
  const f = STYLES[k].filter, h = PV.themeHue;
  if (f === 'tint') return 'saturate(1.12) brightness(1.04)';
  if (f === 'tintdark') return h == null ? 'brightness(1.12) contrast(1.05)' : `sepia(.4) hue-rotate(${Math.round(h - 38)}deg) saturate(1.9) brightness(1.15)`;
  return f;
};
/* soft colour wash over the street map: keeps road / water / park colours apart, just harmonises them with the page */
function wash(mp, on){
  let pane = mp.getPane('pvTint');
  if (!pane){ pane = mp.createPane('pvTint'); pane.style.zIndex = 250; pane.style.pointerEvents = 'none'; }
  let d = pane.firstChild;
  if (!on){ if (d) d.style.display = 'none'; return; }
  if (!d){ d = L.DomUtil.create('div', 'pv-wash', pane);
    const fit = () => { try { L.DomUtil.setPosition(d, mp.containerPointToLayerPoint([0,0])); const z = mp.getSize(); d.style.width = z.x + 'px'; d.style.height = z.y + 'px'; } catch(e){} };
    mp.on('move zoom zoomend resize viewreset', fit); fit(); }
  const h = PV.themeHue, H = PV.colorUtil && PV.colorUtil.hsl2hex;
  d.style.display = h == null || !H ? 'none' : 'block';
  if (h != null && H){ d.style.background = `linear-gradient(135deg, ${H(70, 90)}, ${H((h+28)%360, 70, 91)})`; }
}
const paint = (mp, k) => { try { wash(mp, !!STYLES[k].tint); } catch(e){} const pane = mp.getPane && mp.getPane('tilePane'); if (pane) pane.style.filter = filterFor(k); const el = mp.getContainer(); ORDER.forEach(x => el.classList.remove('ms-' + x)); el.classList.add('ms-' + k); };

const orig = PV.baseLayer;
PV.baseLayer = (mp) => {
  const k = pick(); const st = STYLES[k];
  let ok = 0, bad = 0, done = false; const group = L.layerGroup().addTo(mp);
  const fallback = () => { if (done) return; done = true; try { mp.removeLayer(group); } catch(e){} paint(mp, 'google'); orig(mp); };
  st.layers.forEach((t, i) => { const l = L.tileLayer(t.url, t.o); if (i === 0){ l.on('tileload', () => { ok++; done = true; }); l.on('tileerror', () => { bad++; if (!ok && bad >= 3) fallback(); }); } group.addLayer(l); });
  setTimeout(() => { if (!ok) fallback(); }, 6000);
  paint(mp, k);
  mp._pvStyle = {group, k};
};
PV.restyleMap = () => {
  const mp = PV._mapRef; if (!mp || !mp._pvStyle) return;
  try { mp.removeLayer(mp._pvStyle.group); PV.baseLayer(mp); } catch(e){}
};

/* ---------- picker on the map ---------- */
const _map = PV.views.map;
PV.views.map = (m) => {
  _map(m);
  const tog = $('#togglePanel', m); if (!tog || $('#mapStyleBtn', m)) return;
  const b = document.createElement('button'); b.className = 'btn sm ghost'; b.id = 'mapStyleBtn'; b.innerHTML = '🎨 ' + PV.L('Kiểu bản đồ','Map style');
  tog.after(b);
  b.onclick = (e) => {
    e.stopPropagation();

    const cur = state.settings.mapStyle || 'auto';

    pop.innerHTML = `<b class="ms-h">${PV.L('Kiểu bản đồ','Map style')}</b><div class="ms-grid">${ORDER.map(k => { const s = STYLES[k];
      const name = k === 'auto' ? PV.L('Tự động','Auto') : PV.L(s.vi, s.en), sub = k === 'auto' ? PV.L('sáng, hợp màu trang','light, matches page') : PV.L(...s.sub);
      const th = k === 'auto' ? 'conic-gradient(from 45deg,#F2EFE9,#BFDDF2,#F6E7F0,#F2EFE9)' : s.thumb;
      return `<button class="ms-opt ${cur===k?'on':''}" data-ms="${k}"><i style="background:${th}"></i><span>${name}</span><small>${sub}</small></button>`; }).join('')}</div>`;
    const r = b.getBoundingClientRect(); pop.style.top = (r.bottom + 8) + 'px'; pop.style.right = Math.max(10, innerWidth - r.right) + 'px';
    document.body.appendChild(pop);
    $$('[data-ms]', pop).forEach(o => o.onclick = () => { state.settings.mapStyle = o.dataset.ms; PV.save('settings'); $$('[data-ms]', pop).forEach(x => x.classList.toggle('on', x === o)); PV.restyleMap(); });
    setTimeout(() => document.addEventListener('click', function off(ev){ if (!pop.contains(ev.target)){ pop.remove(); document.removeEventListener('click', off); } }), 0);
  };
};
/* follow theme changes when on Auto / Pastel */
const _apply = PV.applyTheme;
PV.applyTheme = (t) => { const r = _apply(t); const s = state.settings.mapStyle || 'auto'; if ((s === 'auto' || s === 'pastel') && PV._mapRef) PV.restyleMap(); return r; };
const _leave = () => { const p = $('#msPop'); if (p) p.remove(); };
window.addEventListener('hashchange', _leave);
})();

/* ===== Personavel – the guide robot does little fun things now and then (decoration only) ===== */
(function(){
'use strict';
const ACTS = [
  {k:'jump',  say:['Hây!','Hop!'], t:1600},
  {k:'spin',  say:['Xoay nè~','Wheee~'], t:1500},
  {k:'sit',   say:['Ngồi nghỉ xíu…','Taking a seat…'], t:3200},

  {k:'sleep', say:['Zzz…','Zzz…'], t:4200, prop:'💤'},
  {k:'dance', say:['🎵 La la la','🎵 La la la'], t:2800, prop:'🎶'},

  {k:'peek',  say:['Ú òa!','Peekaboo!'], t:2200}
];
let timer = null, busy = false, last = '', first = true;
function play(fab, a){
  if (PV.SIMPLE) return;
  busy = true;
  const tip = document.createElement('div'); tip.className = 'fun-say'; tip.textContent = PV.L(...a.say);
  const r = fab.getBoundingClientRect(); tip.style.right = (innerWidth - r.right + r.width*.35) + 'px'; tip.style.bottom = (innerHeight - r.top + 8) + 'px';
  document.body.appendChild(tip);

  fab.classList.add('fun', 'fun-' + a.k);
  setTimeout(() => { fab.classList.remove('fun', 'fun-' + a.k); tip.classList.add('out'); if (prop) prop.classList.add('out'); setTimeout(() => { tip.remove(); prop && prop.remove(); busy = false; }, 350); }, a.t);
}
function tick(){
  clearTimeout(timer);
  timer = setTimeout(() => {
    const fab = document.getElementById('fab');
    const calm = document.body.classList.contains('reduce') || document.hidden || document.querySelector('#chatpop.on,.modal-bg,.overlay,#slam,#lk,#wxtip');
    if (fab && !busy && !calm && fab.getClientRects().length){
      let a; do { a = ACTS[Math.random()*ACTS.length|0]; } while (a.k === last && ACTS.length > 1);
      last = a.k; play(fab, a);
    }
    tick();
  }, first ? 6000 : 10000 + Math.random()*10000); first = false;
}
PV.funBot = (k) => { const fab = document.getElementById('fab'); const a = ACTS.find(x => x.k === k) || ACTS[0]; if (fab && !busy) play(fab, a); };
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#fab')){ const f = document.getElementById('fab'); f && f.classList.remove('fun', ...ACTS.map(a=>'fun-'+a.k)); } }, true);
tick();
})();

/* ===== Personavel – map gestures =====
   - mouse drag / one-finger drag: move the map (Leaflet)
   - mouse wheel, touchpad vertical scroll, pinch, + / - buttons: zoom (Leaflet, reliable in every browser)
   - touchpad sideways swipe: move the map left / right */
(function(){
'use strict';
function setup(mp){
  if (mp._pvGest) return; mp._pvGest = true;
  try { mp.dragging.enable(); mp.touchZoom.enable(); mp.keyboard.enable(); mp.scrollWheelZoom.enable(); mp.doubleClickZoom.enable(); } catch(e){}
  mp.options.wheelPxPerZoomLevel = 130; mp.options.wheelDebounceTime = 30;
  const el = mp.getContainer(); el.classList.add('pv-pan');
  el.addEventListener('wheel', (e) => {
    if (e.ctrlKey) return;                                        // pinch → Leaflet zooms
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.2 && Math.abs(e.deltaX) > 1){
      e.preventDefault(); e.stopPropagation();
      mp.panBy([e.deltaX, 0], {animate:false});
    }
  }, {passive:false, capture:true});
}
const prev = PV.baseLayer;
PV.baseLayer = (mp) => { try { setup(mp); } catch(e){} return prev(mp); };
})();

PV.introSwap = (ov, at, fadeBack) => {
  if (document.body.classList.contains('reduce')) return;
  const bg = document.getElementById('pvbg'); const cs = bg ? getComputedStyle(bg) : null;
  const v = (n, d) => (cs && cs.getPropertyValue(n).trim()) || d;
  const themed = PV.state.settings.theme && PV.state.settings.theme.id && PV.state.settings.theme.id !== 'default';
  const c1 = themed ? v('--b1','#FFFFFF') : '#E4F1FC', c2 = themed ? v('--b2','#DCEBF8') : '#9FCBEE', c3 = themed ? v('--b3','#F4F9FE') : '#BFDCF5', c4 = themed ? v('--b4','#CFE3F6') : '#5E9FD6';
  // brightest of the colours flashes up from below
  const L = h => { h = h.replace('#',''); const n = parseInt(h,16); return (n>>16&255)*.3 + (n>>8&255)*.59 + (n&255)*.11; };
  const sat = h => { h = h.replace('#',''); const n = parseInt(h,16), r=(n>>16&255), g=(n>>8&255), b=(n&255); const mx=Math.max(r,g,b), mn=Math.min(r,g,b); return mx ? (mx-mn)/mx * (mx/255+.35) : 0; };
  const cols = [c1,c2,c3,c4].sort((a,b)=>L(a)-L(b)); const dark = cols[0];
  const accent = [c1,c2,c3,c4].filter(c=>c!==dark).sort((a,b)=>sat(b)-sat(a))[0] || cols[3];
  const mix = (a, b, t) => { const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16); const ch=(x,s)=>(x>>s)&255; return '#'+[16,8,0].map(s=>Math.round(ch(A,s)+(ch(B,s)-ch(A,s))*t).toString(16).padStart(2,'0')).join(''); };
  const mid = L(dark) < 60 ? mix(accent, '#FFFFFF', .12) : accent, light = mix(accent, '#FFFFFF', L(dark) < 60 ? .45 : .6);
  const fx = document.createElement('div'); fx.className = 'introswap';
  const vw = innerWidth, vh = innerHeight, diag = Math.hypot(vw, vh), ang = Math.atan2(vh, vw) * 180 / Math.PI;
  fx.style.cssText = `--dk:${dark};--md:${mid};--lt:${light};--ang:${ang.toFixed(2)}deg;--diag:${Math.round(diag)}px;--len:${Math.round(Math.max(260, diag*.42))}px`;
  fx.innerHTML = '<i class="sa"></i><i class="sb"></i><i class="streak"><b></b></i><i class="streak s2"><b></b></i>';
  setTimeout(() => { if (document.body.contains(ov)) ov.appendChild(fx); }, at);

  setTimeout(() => { const lg = ov.querySelector('.intro-stage .logoText') || ov.querySelector('.logoText'); if (lg){ lg.style.setProperty('--lt', light); lg.classList.add('lit'); } }, at + 750);
};

/* smooth intro: robot slides in with the logo, then one continuous half circle under it, ending on the right */
PV.animateIntroBot = (ov) => {
  const bot = ov.querySelector('.introbot'), stage = ov.querySelector('.intro-stage'); if (!bot || !stage) return;
  const reduce = document.body.classList.contains('reduce') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const run = () => {
    const W = stage.offsetWidth, H = stage.offsetHeight, w = bot.offsetWidth, h = bot.offsetHeight;
    const sr = stage.getBoundingClientRect();
    const roomLeft = sr.left;
    let x0 = -w - 6, y0 = -h * 0.08;
    if (roomLeft < w + 10){ x0 = 0; y0 = H * 0.85; }                    // narrow screens: start under the left end of the logo
    let x1 = W + 6; const roomRight = innerWidth - sr.right;
    let y1 = y0;
    if (roomRight < w + 10){ x1 = W - w; y1 = H * 0.85; }            // narrow screens: stop under the right end of the logo
    const cx = (x0 + x1) / 2, rx = (x1 - x0) / 2, depth = H * 1.05 + h * 0.15;
    const frames = [];
    const N = 48;
    for (let k = 0; k <= N; k++){
      const t = k / N, phi = Math.PI * t;
      const x = cx - rx * Math.cos(phi);
      const y = y0 + (y1 - y0) * t + depth * Math.sin(phi);
      const tilt = -10 * Math.cos(phi);                                 // leans into the curve
      frames.push({transform:`translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${tilt.toFixed(1)}deg)`});
    }
    const endT = frames[frames.length-1].transform.replace(/rotate\([^)]*\)/,'rotate(0deg)');
    frames[frames.length-1] = {transform:endT};
    bot.style.transform = frames[0].transform;
    if (reduce){ bot.style.transform = endT; bot.style.opacity = 1; return; }
    // phase 1: arrive together with the logo
    const inAnim = bot.animate([{transform:`translate(${(x0 - innerWidth*0.6).toFixed(1)}px, ${y0}px)`, opacity:0},{transform:frames[0].transform, opacity:1}],
      {duration:600, easing:'cubic-bezier(.2,.8,.2,1)', fill:'forwards'});
    inAnim.onfinish = () => { bot.style.opacity = 1;
      // phase 2: one smooth half circle (single easing over the whole path)
      const arc = bot.animate(frames, {duration:1050, easing:'cubic-bezier(.45,.05,.35,1)', fill:'forwards'});
      arc.onfinish = () => { bot.style.transform = endT; bot.classList.add('landed'); };
    };
  };
  const start = () => requestAnimationFrame(() => requestAnimationFrame(run));
  // wait for the brush font so the path is measured on the final logo width
  try { Promise.race([document.fonts.load("100px PVBrush"), new Promise(r=>setTimeout(r,400))]).then(start); } catch(e){ start(); }
};

    Object.assign(hole.style, {left:r.left-6+'px', top:r.top-6+'px', width:r.width+12+'px', height:r.height+12+'px'});
    tip.innerHTML = `<div class="row" style="align-items:flex-start;flex-wrap:nowrap">${PV.robot(PV.GUIDES[0],{wave:false}).replace('<svg','<svg style="width:46px;flex:0 0 46px"')}<div><b>${t}</b><p class="small" style="margin:4px 0 10px">${d}</p></div></div>
      <div class="row"><span class="tiny muted">${i+1}/${steps.length}</span><span class="spacer"></span><button class="btn ghost sm" id="tskip">Bỏ qua</button><button class="btn sm" id="tnext">${i<steps.length-1?'Tiếp tục':'Hoàn tất'}</button></div>`;
    const tw = Math.min(340, innerWidth*.9);
    if (mobile) Object.assign(tip.style, {left:Math.max(8, Math.min(innerWidth-tw-8, r.left + r.width/2 - tw/2))+'px'}, r.top < innerHeight/2 ? {top:(r.bottom + 14)+'px', bottom:''} : {top:'', bottom:(innerHeight - r.top + 14)+'px'});
    else Object.assign(tip.style, {left:r.right+18+'px', top:Math.max(10, r.top-20)+'px', bottom:''});
    $('#tskip',tip).onclick = end; $('#tnext',tip).onclick = () => { i++; i<steps.length ? draw() : end(); };
  };
  draw();
};

/* ---------- simple mode: fewer features on screen ----------
   Hidden: background & map-style pickers, weather effects, dancing robot, points / badges / stamps,
   diary, photo moments and place reviews. Set PV.SIMPLE = false to bring them all back. */
PV.SIMPLE = true;
if (PV.SIMPLE){
  document.documentElement.classList.add('simple');
  const noop = () => {};
  PV.weatherFX = noop; PV.weatherTip = noop; PV.funBot = noop;
  PV.queueCeleb = noop; PV.celebrate = noop; PV.checkBadges = noop;
  PV.addPoints = (n) => { PV.state.points += n; PV.save('points'); };          // keep counting quietly, no pop-ups
  PV.themeSection = () => '';
  const _prof = PV.views.profile;
  PV.views.profile = (m) => { _prof(m);
    $$('#main .card').forEach(c => { const h = (c.querySelector('h3')||{}).textContent || '';
      if (c.classList.contains('rv-card') || /Nhật ký|Journey diary|Khoảnh khắc|Moments/i.test(h)) c.remove(); });
    $$('#main .grid.g3.keep').forEach(g => g.remove());
    $$('#main .grid.g2').forEach(g => { if (!g.children.length) g.remove(); }); };
}

/* ---------- init ---------- */
/* first visit: ask which language to use before anything else */
PV.langGate = (next) => {
  if (state.settings.langChosen){ next(); return; }
  const g = PV.GUIDES[0];
  const ov = document.createElement('div'); ov.className = 'overlay langgate'; ov.id = 'langgate';
  ov.innerHTML = `${[[8,40,90,26],[22,70,140,34],[60,20,110,28],[75,82,160,40]].map(([t,dl,w,h],i)=>`<div class="cloud" style="top:${t}vh;width:${w}px;height:${h}px;animation-delay:-${dl/4}s;animation-duration:${26+i*6}s"></div>`).join('')}<div class="lg-card">
      <div class="lg-bot">${PV.robot(g)}</div>
      <h2>Xin chào! <span>Hello!</span></h2>
      <p>Bạn muốn dùng ngôn ngữ nào?<br><span>Which language would you like to use?</span></p>
      <div class="lg-opts">
        <button class="lg-opt" data-l="vi"><svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" rx="3" fill="#DA251D"/><path d="M15 4.2l1.35 4.15h4.36l-3.53 2.56 1.35 4.15L15 12.5l-3.53 2.56 1.35-4.15-3.53-2.56h4.36z" fill="#FFCD00"/></svg><strong>Tiếng Việt</strong><small>Vietnamese</small></button>
        <button class="lg-opt" data-l="en"><svg class="flag" viewBox="0 0 60 40"><clipPath id="lgc"><rect width="60" height="40" rx="6"/></clipPath><g clip-path="url(#lgc)"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="7"/></g></svg><strong>English</strong><small>Tiếng Anh</small></button>
      </div>
      <small class="lg-note">Bạn có thể đổi lại bất cứ lúc nào trong Cài đặt · You can change this anytime in Settings</small>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.lg-opt').forEach(b => b.onclick = () => {
    state.settings.langChosen = true; PV.save('settings');
    if (PV.lang !== b.dataset.l) PV.setLang(b.dataset.l); else PV.save('settings');
    b.classList.add('picked'); ov.classList.add('out');
    setTimeout(() => { ov.remove(); next(); }, 380);
  });
};
PV.init = () => {
  document.body.classList.toggle('reduce', !!state.settings.reduce);
  PV.shell();
  PV.i18nInit();
  PV.route();
  const p = state.profile;
  if (!p || !p.onboarded){ // brand-new visitor (never picked a language yet): default white–blue; returning users keep their theme
    if (!state.settings.langChosen && state.settings.theme && state.settings.theme.id !== 'default'){ state.settings.theme = {id:'default'}; PV.save('settings'); PV.applyTheme && PV.applyTheme({id:'default'}); }
    PV.langGate(() => PV.welcome());
  }
  else PV.welcome(false);
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', PV.init); else PV.init();
})();

</script>
