p cẩm","Thịt luộc","Nem rán"],"phone":null,"maps_url":"https://maps.app.goo.gl/DdA7z4FdJo82QSmy8?g_st=ic","source_name":"Khảo sát của nhóm + Google Maps","updated":"11/2026"},{"id":"f73","name":"Tàu Hủ Xe Lam","cats":["food"],"kind":"Ẩm thực","michelin":false,"address":"459/13 Trần Hưng Đạo, Cầu Ông Lãnh","coords":[106.687125,10.758422],"geo":"approx","desc":"Xe tàu hủ (tào phớ) lâu năm, tàu hủ mềm mịn với nước đường gừng ấm.","hours":["10:00–21:30"],"price":[],"price_level":0,"visit_min":25,"highlights":["Tàu hủ thập cẩm","Tàu hủ nước đường gừng"],"phone":null,"maps_url":"https://maps.app.goo.gl/JL4DC3WBmznMhaas9?g_st=ic","source_name":"Khảo sát của nhóm + Google Maps","updated":"11/2026"}],"streets":[{"name":"Nguyễn Huệ","wards":"Sài Gòn","area":"Quận 1 (cũ)","story":"Anh hùng dân tộc, lãnh tụ phong trào Tây Sơn, vị hoàng đế có công đánh tan quân Xiêm năm 1785 và quân Thanh năm 1789, bảo vệ nền độc lập dân tộc.","id":"r0","story_en":"National hero and leader of the Tây Sơn movement; the emperor who defeated the Siamese army in 1785 and the Qing army in 1789, protecting the nation's independence."},{"name":"Lê Lợi","wards":"Sài Gòn, Bến Thành","area":"Quận 1 (cũ)","story":"Anh hùng dân tộc, người lãnh đạo cuộc khởi nghĩa Lam Sơn (1418–1427), đánh đuổi quân Minh và sáng lập triều Hậu Lê.","id":"r1","story_en":"National hero who led the Lam Sơn uprising (1418–1427), drove out the Ming army and founded the Later Lê dynasty."},{"name":"Hai Bà Trưng","wards":"Sài Gòn, Tân Định","area":"Quận 1 (cũ)","story":"Hai nữ anh hùng Trưng Trắc và Trưng Nhị, lãnh đạo cuộc khởi nghĩa năm 40 chống ách đô hộ của nhà Đông Hán, giành quyền tự chủ cho dân tộc.","id":"r2","story_en":"The two heroines Trưng Trắc and Trưng Nhị, who led the uprising of the year 40 against Eastern Han rule and won back the nation's self-rule."},{"name":"Trần Hưng Đạo","wards":"Bến Thành, Cầu Ông Lãnh","area":"Quận 1 (cũ)","story":"Tên tước hiệu của Trần Quốc Tuấn, vị Quốc công Tiết chế tài ba, lãnh đạo quân dân Đại Việt ba lần kháng chiến chống quân Nguyên – Mông thắng lợi.","id":"r3","story_en":"The noble title of Trần Quốc Tuấn, the brilliant commander-in-chief who led Đại Việt to victory in three wars against the Mongol–Yuan invaders."},{"name":"Phạm Ngũ Lão","wards":"Bến Thành","area":"Quận 1 (cũ)","story":"Danh tướng thời Trần, là một trong những tướng lĩnh tài ba dưới quyền Trần Hưng Đạo, có nhiều đóng góp trong các cuộc kháng chiến chống quân Nguyên – Mông.","id":"r4","story_en":"A famous Trần-dynasty general serving under Trần Hưng Đạo, with great contributions to the wars against the Mongol–Yuan invaders."},{"name":"Lê Thánh Tôn","wards":"Sài Gòn, Cầu Ông Lãnh","area":"Quận 1 (cũ)","story":"Tên đường chỉ vua Lê Thánh Tông, vị vua tiêu biểu thời Hậu Lê. Ông có công cải cách chính trị, hoàn thiện pháp luật, phát triển giáo dục, văn hóa và mở rộng lãnh thổ Đại Việt.","id":"r5","story_en":"Named after King Lê Thánh Tông, an outstanding Later Lê king who reformed politics, perfected the law, developed education and culture and expanded Đại Việt's territory."},{"name":"Cô Giang và Cô Bắc","wards":"Cầu Ông Lãnh","area":"Quận 1 (cũ)","story":"Hai nữ chiến sĩ yêu nước Nguyễn Thị Giang và Nguyễn Thị Bắc, thành viên Việt Nam Quốc dân Đảng, gắn liền với phong trào đấu tranh chống thực dân Pháp và cuộc khởi nghĩa Yên Bái năm 1930.","id":"r6","story_en":"Two patriotic women, Nguyễn Thị Giang and Nguyễn Thị Bắc, members of the Vietnamese Nationalist Party, linked to the struggle against French colonial rule and the 1930 Yên Bái uprising."},{"name":"Nguyễn Trãi","wards":"Bến Thành, Cầu Ông Lãnh","area":"Quận 1 (cũ)","story":"Danh nhân văn hóa thế giới, nhà chính trị, quân sự và văn học lỗi lạc. Ông có công lớn trong cuộc khởi nghĩa Lam Sơn, là tác giả Bình Ngô đại cáo.","id":"r7","story_en":"A world cultural figure and brilliant statesman, strategist and writer; he played a major role in the Lam Sơn uprising and wrote the “Great Proclamation upon the Pacification of the Wu”."},{"name":"Trần Quang Khải","wards":"Tân Định","area":"Quận 1 (cũ)","story":"Hoàng tử, danh tướng và nhà thơ thời Trần. Ông có công lớn trong cuộc kháng chiến chống quân Nguyên – Mông, đặc biệt với chiến thắng Chương Dương năm 1285.","id":"r8","story_en":"Prince, general and poet of the Trần dynasty, a key figure in the wars against the Mongol–Yuan invaders, especially the victory at Chương Dương in 1285."},{"name":"Trần Nhật Duật","wards":"Tân Định","area":"Quận 1 (cũ)","story":"Hoàng tử, danh tướng thời Trần, có nhiều đóng góp trong các cuộc kháng chiến chống quân Nguyên – Mông. Ông còn nổi tiếng về tài ngoại giao, hiểu biết văn hóa và ngôn ngữ các dân tộc.","id":"r9","story_en":"Prince and general of the Trần dynasty who contributed to the wars against the Mongol–Yuan invaders; also famous for his diplomacy and knowledge of other peoples' languages and cultures."},{"name":"Trần Khánh Dư","wards":"Tân Định","area":"Quận 1 (cũ)","story":"Danh tướng thời Trần, có công trong ba cuộc kháng chiến chống quân Nguyên – Mông, đặc biệt là chiến thắng Vân Đồn năm 1287, góp phần phá hủy nguồn tiếp tế của địch.","id":"r10","story_en":"A Trần-dynasty general in all three wars against the Mongol–Yuan invaders, best known for the 1287 victory at Vân Đồn that destroyed the enemy's supply fleet."},{"name":"Nguyễn Thái Học","wards":"Bến Thành, Cầu Ông Lãnh","area":"Quận 1 (cũ)","story":"Nhà yêu nước, người sáng lập và lãnh đạo Việt Nam Quốc dân Đảng, gắn liền với cuộc khởi nghĩa Yên Bái năm 1930 nhằm chống thực dân Pháp.","id":"r11","story_en":"Patriot, founder and leader of the Vietnamese Nationalist Party, associated with the 1930 Yên Bái uprising against French colonial rule."},{"name":"Ký Con","wards":"Bến Thành","area":"Quận 1 (cũ)","story":"Tên thật Đoàn Trần Nghiệp, chiến sĩ Việt Nam Quốc dân Đảng, tham gia phong trào đấu tranh chống thực dân Pháp và cuộc khởi nghĩa Yên Bái năm 1930.","id":"r12","story_en":"Real name Đoàn Trần Nghiệp, a member of the Vietnamese Nationalist Party who fought against French colonial rule and took part in the 1930 Yên Bái uprising."},{"name":"Phó Đức Chính","wards":"Bến Thành","area":"Quận 1 (cũ)","story":"Nhà yêu nước, một trong những lãnh đạo chủ chốt của Việt Nam Quốc dân Đảng, tham gia lãnh đạo cuộc khởi nghĩa Yên Bái năm 1930 và hy sinh năm 1930.","id":"r13","story_en":"Patriot and one of the key leaders of the Vietnamese Nationalist Party; he helped lead the 1930 Yên Bái uprising and died in 1930."},{"name":"Võ Thị Sáu","wards":"Tân Định","area":"Quận 1 (cũ)","story":"Nữ anh hùng liệt sĩ, tham gia hoạt động cách mạng từ khi còn trẻ, nổi bật với tinh thần yêu nước, lòng dũng cảm và sự kiên trung trong cuộc kháng chiến chống thực dân Pháp.","id":"r14","story_en":"A heroine and martyr who joined the revolution at a young age, known for her patriotism, courage and steadfastness in the resistance against French colonial rule."},{"name":"Mạc Đĩnh Chi","wards":"Tân Định","area":"Quận 1 (cũ)","story":"Trạng nguyên nổi tiếng thời Trần, là nhà ngoại giao và nhà khoa bảng tài giỏi, được biết đến với kiến thức uyên bác và tài ứng đối.","id":"r15","story_en":"A famous first-ranked doctoral laureate (Trạng nguyên) of the Trần dynasty, a diplomat and scholar known for his vast knowledge and quick wit."},{"name":"Hàm Nghi","wards":"Sài Gòn, Bến Thành","area":"Quận 1 (cũ)","story":"Vị vua yêu nước của triều Nguyễn, người phát động phong trào Cần Vương thông qua Chiếu Cần Vương năm 1885, kêu gọi nhân dân đứng lên chống thực dân Pháp.","id":"r16","story_en":"A patriotic Nguyễn-dynasty king who launched the Cần Vương (Aid the King) movement with his 1885 edict, calling on the people to rise against French colonial rule."},{"name":"Bùi Thị Xuân","wards":"Bến Thành","area":"Quận 1 (cũ)","story":"Nữ tướng tài ba của phong trào Tây Sơn, nổi tiếng với tài năng quân sự, tinh thần dũng cảm và lòng trung thành với nhà Tây Sơn.","id":"r17","story_en":"A talented woman general of the Tây Sơn movement, famous for her military skill, bravery and loyalty to the Tây Sơn dynasty."},{"name":"Đặng Trần Côn","wards":"Bến Thành","area":"Quận 1 (cũ)","story":"Danh sĩ, nhà thơ thời Lê – Trịnh, tác giả nguyên tác chữ Hán Chinh phụ ngâm, tác phẩm thể hiện nỗi nhớ thương, sự cô đơn của người chinh phụ và khát vọng hạnh phúc trong thời chiến.","id":"r18","story_en":"A scholar and poet of the Lê–Trịnh period, author of the original Chinese-script “Song of a Soldier's Wife”, which expresses longing, loneliness and the wish for happiness in wartime."},{"name":"Bà Huyện Thanh Quan","wards":"Xuân Hoà, Nhiêu Lộc","area":"Quận 3 (cũ)","story":"Nữ thi sĩ nổi tiếng thế kỷ XIX, tên thật Nguyễn Thị Hinh. Bà được biết đến qua những bài thơ Nôm giàu cảm xúc như Qua Đèo Ngang, Thăng Long thành hoài cổ. Tên gọi Bà Huyện Thanh Quan xuất phát từ chức vụ của chồng bà.","id":"r19","story_en":"A famous 19th-century poetess, real name Nguyễn Thị Hinh, known for moving Nôm poems such as “Crossing Ngang Pass”. Her pen name comes from her husband's official title."},{"name":"Cao Thắng","wards":"Bàn Cờ","area":"Quận 3 (cũ)","story":"Chiến tướng trong phong trào Cần Vương, là cộng sự đắc lực của Phan Đình Phùng trong cuộc khởi nghĩa Hương Khê chống thực dân Pháp.","id":"r20","story_en":"A commander of the Cần Vương movement and close ally of Phan Đình Phùng in the Hương Khê uprising against French colonial rule."},{"name":"Lê Quý Đôn","wards":"Xuân Hoà","area":"Quận 3 (cũ)","story":"Nhà bác học lớn thời Hậu Lê, nổi tiếng với kiến thức uyên bác trên nhiều lĩnh vực như lịch sử, văn học, triết học và khoa học. Ông để lại nhiều công trình nghiên cứu có giá trị.","id":"r21","story_en":"A great Later Lê polymath, famous for his deep knowledge of history, literature, philosophy and science, who left many valuable works."},{"name":"Trương Định","wards":"Bến Thành, Xuân Hòa, Nhiêu Lộc","area":"Quận 3 (cũ)","story":"Thủ lĩnh phong trào kháng Pháp ở Nam Kỳ thế kỷ XIX. Ông được nhân dân suy tôn là Bình Tây Đại Nguyên soái và trở thành biểu tượng của tinh thần chống ngoại xâm.","id":"r22","story_en":"Leader of the 19th-century anti-French resistance in southern Vietnam (Nam Kỳ). The people honoured him as “Grand Marshal Pacifying the West”, a symbol of resistance against invaders."},{"name":"Võ Văn Tần","wards":"Bàn Cờ, Xuân Hòa","area":"Quận 3 (cũ)","story":"Nhà cách mạng Việt Nam, một trong những lãnh đạo chủ chốt của Đảng Cộng sản Đông Dương, từng giữ chức Bí thư Xứ ủy Nam Kỳ và có nhiều đóng góp cho phong trào cách mạng.","id":"r23","story_en":"A Vietnamese revolutionary and key leader of the Indochinese Communist Party, once Secretary of the Nam Kỳ Regional Committee, with many contributions to the revolutionary movement."},{"name":"Nguyễn Thị Minh Khai","wards":"Bến Thành, Bàn Cờ, Xuân Hòa","area":"Quận 3 (cũ)","story":"Nữ chiến sĩ cách mạng tiêu biểu, từng giữ nhiều trọng trách trong Đảng Cộng sản Đông Dương, có đóng góp quan trọng cho phong trào cách mạng ở Nam Kỳ và hy sinh năm 1941.","id":"r24","story_en":"An outstanding woman revolutionary who held important roles in the Indochinese Communist Party, contributed greatly to the revolutionary movement in Nam Kỳ and died in 1941."},{"name":"Kỳ Đồng","wards":"Nhiêu Lộc","area":"Quận 3 (cũ)","story":"Tên thật Nguyễn Văn Cẩm, nổi tiếng là thần đồng cuối thế kỷ XIX. Ông là nhân vật yêu nước, gắn với các hoạt động chống thực dân Pháp trong giai đoạn đầu của phong trào đấu tranh dân tộc.","id":"r25","story_en":"Real name Nguyễn Văn Cẩm, a famous child prodigy of the late 19th century and a patriot linked to early anti-French activities."},{"name":"Nguyễn Đình Chiểu","wards":"Tân Định, Sài Gòn, Xuân Hòa, Bàn Cờ","area":"Quận 3 (cũ)","story":"Nhà thơ, nhà giáo yêu nước thế kỷ XIX, nổi tiếng với tác phẩm Lục Vân Tiên và Văn tế nghĩa sĩ Cần Giuộc. Các sáng tác của ông đề cao đạo lý, lòng yêu nước và tinh thần chống ngoại xâm.","id":"r26","story_en":"A 19th-century patriotic poet and teacher, famous for “Lục Vân Tiên” and the “Funeral Oration for the Righteous Soldiers of Cần Giuộc”; his works praise morality, patriotism and resistance against invaders."},{"name":"Hồ Xuân Hương","wards":"Xuân Hoà","area":"Quận 3 (cũ)","story":"Nữ thi sĩ nổi tiếng cuối thế kỷ XVIII – đầu thế kỷ XIX, được mệnh danh là Bà Chúa thơ Nôm. Thơ bà thể hiện tiếng nói cảm thông, đề cao phẩm giá người phụ nữ và phê phán những bất công trong xã hội.","id":"r27","story_en":"A celebrated poetess of the late 18th – early 19th century, called the “Queen of Nôm poetry”. Her poems speak with compassion, uphold women's dignity and criticise social injustice."},{"name":"Tú Xương","wards":"Xuân Hoà","area":"Quận 3 (cũ)","story":"Tên thật Trần Tế Xương, nhà thơ trào phúng nổi tiếng cuối thế kỷ XIX – đầu thế kỷ XX. Thơ ông phản ánh chân thực, sâu sắc những bất cập và thói hư tật xấu của xã hội đương thời.","id":"r28","story_en":"Real name Trần Tế Xương, a famous satirical poet of the late 19th – early 20th century whose poems vividly expose the flaws and vices of the society of his time."},{"name":"Ngô Thời Nhiệm","wards":"Xuân Hoà","area":"Quận 3 (cũ)","story":"Tên nhân vật là Ngô Thì Nhậm, danh sĩ, nhà chính trị và ngoại giao thời Lê – Trịnh và Tây Sơn. Ông có đóng góp quan trọng trong việc xây dựng chính quyền Tây Sơn và bang giao với nhà Thanh.","id":"r29","story_en":"The historical figure Ngô Thì Nhậm, a scholar, statesman and diplomat of the Lê–Trịnh and Tây Sơn periods, who helped build the Tây Sơn government and its relations with the Qing."},{"name":"Trần Quang Diệu","wards":"Nhiêu Lộc","area":"Quận 3 (cũ)","story":"Danh tướng tiêu biểu của phong trào Tây Sơn, có nhiều công lao trong các chiến dịch quân sự quan trọng, góp phần bảo vệ và củng cố chính quyền Tây Sơn.","id":"r30","story_en":"A leading general of the Tây Sơn movement with many merits in major military campaigns, helping protect and strengthen the Tây Sơn government."},{"name":"Nguyễn Gia Thiều","wards":"Xuân Hoà","area":"Quận 3 (cũ)","story":"Danh sĩ, nhà thơ thời Lê – Trịnh, nổi tiếng với tác phẩm Cung oán ngâm khúc, thể hiện nỗi niềm về thân phận con người và những bất công trong xã hội phong kiến.","id":"r31","story_en":"A scholar and poet of the Lê–Trịnh period, famous for “Lament of a Royal Concubine”, which reflects on human fate and the injustice of feudal society."},{"name":"Đoàn Thị Điểm","wards":"Xuân Hoà","area":"Quận 3 (cũ)","story":"Nữ sĩ tài năng thời Lê – Trịnh, được truyền tụng là tác giả của bản dịch chữ Nôm Chinh phụ ngâm theo cách quy thuộc truyền thống, góp phần làm phong phú nền văn học Việt Nam.","id":"r32","story_en":"A gifted woman writer of the Lê–Trịnh period, traditionally credited with the Nôm translation of “Song of a Soldier's Wife”, enriching Vietnamese literature."}],"clusters":[{"name":"Cụm danh tướng nhà Trần","ward":"Tân Định","streets":["Trần Quang Khải","Trần Nhật Duật","Trần Khánh Dư","Trần Khắc Chân"]},{"name":"Cụm văn thơ","ward":"Xuân Hoà, Nhiêu Lộc","streets":["Hồ Xuân Hương","Bà Huyện Thanh Quan","Đoàn Thị Điểm","Đặng Trần Côn","Nguyễn Gia Thiều"]},{"name":"Cụm nhà cách mạng","ward":"Cầu Ông Lãnh, Bến Thành","streets":["Nguyễn Thái Học","Cô Giang","Cô Bắc","Nguyễn Khắc Nhu","Phó Đức Chính","Ký Con"]}]};
/* ===== Personavel – core ===== */
(function(){

  set(k, v){ mem[k] = v; try{ localStorage.setItem('pv_'+k, JSON.stringify(v)); }catch(e){} },

};

/* ---------- geo ---------- */
PV.dist = (a, b) => { // [lng,lat] -> km
  const R=6371, toR=x=>x*Math.PI/180;
  const dLat=toR(b[1]-a[1]), dLng=toR(b[0]-a[0]);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a[1]))*Math.cos(toR(b[1]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};
PV.MODES = {walk:{name:'Đi bộ', kmh:4.5, road:1.25}, moto:{name:'Xe máy', kmh:18, road:1.35}, car:{name:'Ô tô', kmh:15, road:1.35}, taxi:{name:'Taxi / Grab', kmh:16, road:1.35}, bus:{name:'Xe buýt', kmh:12, road:1.4}, metro:{name:'Metro', kmh:22, road:1.5}};
PV.travel = (a, b, mode='moto') => { const m=PV.MODES[mode]||PV.MODES.moto; const km=PV.dist(a,b)*m.road; const extra = mode==='walk'?0 : mode==='metro'||mode==='bus' ? 10 : 4; return {km, min:Math.max(3, Math.round(km/m.kmh*60 + extra))}; };
PV.fmtKm = km => km<1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km';
PV.userPos = null;
/* where the visitor starts: one of the central wards, or their own GPS position */
PV.AREAS = [

];

/* the starting point used for suggestions and itineraries: {name, c:[lng,lat], gps?} */
PV.origin = () => {
  const pr = PV.state.profile?.prefs || {};
  if (pr.start === 'gps' && PV.userPos) return {name:PV.L('Vị trí của bạn','Your location'), c:PV.userPos, gps:true};
  if (pr.start === 'gps' && pr.startPos) return {name:PV.L('Vị trí của bạn','Your location'), c:pr.startPos, gps:true};
  const a = PV.area(pr.start); return a ? {name:PV.L('Phường ','')+a.name, c:a.c, id:a.id} : null;
};

/* ---------- time helpers ---------- */
PV.toMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+(m||0); };
PV.fmtT = m => { m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
PV.parseHours = p => { // first open range found, minutes
  for (const line of (p.hours||[])){
    if (/không tham quan|đóng cửa để sửa/i.test(line) && !/\d/.test(line.split(':')[0])) continue;
    const m = line.match(/(\d{1,2})\s*[:h]\s*(\d{2})?\s*[–\-—]\s*(\d{1,2})\s*[:h]\s*(\d{2})?/);
    if (m){ let o=+m[1]*60+(+m[2]||0), c=+m[3]*60+(+m[4]||0); if (c<=o) c+=1440; return [o,c]; }
  }
  return null;
};

const I = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
PV.ICON = {

PV.toast = (msg) => { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); };
PV.addPoints = (n, why) => { PV.state.points += n; PV.save('points'); if (why) PV.toast(`+${n} điểm · ${why}`); };

/* ---------- recommendation ---------- */
PV.weights = () => {
  const pr = PV.state.profile && PV.state.profile.prefs;
  const w = {history:1, food:1, shopping:.6, checkin:.8, nature:.6, entertainment:.6};
  if (!pr) return w;
  const like = pr.likes || [];
  const map = {food:'food', history:'history', shopping:'shopping', checkin:'checkin', nature:'nature', relax:'nature', art:'history', fun:'entertainment'};
  for (const k in w) w[k] = .35;
  like.forEach(l => { const c=map[l]; if (c) w[c] = Math.min(2, w[c]+1.2); });
  if (pr.style==='culture') w.history += .6;
  if (pr.style==='checkin') w.checkin += .8;
  if (pr.style==='relax') { w.nature += .6; }
  if ((pr.spaces||[]).includes('market')) w.food += .3;
  if ((pr.spaces||[]).includes('museum')) w.history += .3;
  return w;
};
/* places that work well with children: open spaces, museums with free child tickets, sweets & snacks */
PV.KIDS = new Set(['h0','h1','h3','h5','h6','h7','t0','t1','f14','f21','f27','f29','f40','f69','f71','f73','s9','s13']);
PV.budgetLevel = () => { const b = PV.state.profile?.prefs?.budget; return b==='low'?1 : b==='mid'?2 : b==='high'?3 : b==='lux'?3 : 2; };
PV.score = (p, w = PV.weights()) => {
  let s = 0; p.cats.forEach((c,i) => s += (w[c]||.3) * (i===0?1:.5));
  const bl = PV.budgetLevel();
  if (p.price_level!=null){ if (p.price_level > bl) s -= .6*(p.price_level-bl); else s += .1; }
  const pr = PV.state.profile?.prefs || {};
  if (p.michelin && (pr.food||[]).includes('fine')) s += .5;
  if (p.michelin) s += .15;
  if (((pr.diet||[]).includes('veg') || /chay|vegetarian|vegan/i.test(pr.diet_other||'')) && p.cats.includes('food')) s += /chay/i.test(p.name+p.desc) ? 1.2 : -.8;
  if ((pr.food||[]).includes('street') && p.cats.includes('food') && (p.price_level||1) <= 1) s += .3;
  if (p.geo==='missing' || !p.coords) s -= 5;
  if (p.warning) s -= .2;
  const og = PV.origin();
  if (og && p.coords){ const d = PV.dist(og.c, p.coords), walk = (pr.move||[])[0]==='walk' || (pr.needs||[]).some(x=>x==='kids'||x==='elder'||x==='wheel');
    s -= Math.max(0, d - .6) * (walk ? .8 : .4); }                      // far from where you start = less useful
  if ((pr.needs||[]).includes('kids') || [].concat(pr.with||[]).includes('kids')){   // travelling with children
    if (PV.KIDS.has(p.id)) s += .5;
    if (p.id === 'h8') s -= 1.5;                                                  // war images: hard for small children
  }
  return s;
};
PV.recommend = (n=6, filter=()=>true) => D.places.filter(p=>p.coords && filter(p)).map(p=>({p, s:PV.score(p)})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.p);

/* ---------- itinerary builder ---------- */
/* what kind of eating stop is this? 'meal' (a real meal), 'snack' (dessert / drinks / street snacks) or null (not a food stop) */
PV.foodType = (p) => {
  if (!p || !p.cats || !p.cats.includes('food')) return null;
  if (p.cats.some(c => c !== 'food' && c !== 'checkin')) return null;           // e.g. markets: visited for sightseeing
  const t = PV.norm([p.name, ...(p.highlights||[]).slice(0,2)].join(' '));
  const nm = PV.norm(p.name);
  if (/^(bun|pho|com|mi |mien|hu tieu|chao|banh canh|canh bun|lau|nha hang|quan an|bo kho|bo bit tet|cha ca|banh da|banh cuon|banh xeo|bo la lot)/.test(nm) && !/che|am thuc/.test(nm)) return 'meal';
  if (/(^| )(che|che nong|flan|milo|milo dam|tau hu|tao pho|banh tieu|banh trang tron|kem tuoi|kem que|tiem kem|tra sua|ca phe|cafe|coffee|sinh to|nuoc ep|bot chien|xoi che|goi cuon|banh beo|bach tuoc|oc|banh can|banh flan|dessert|do uong|nuoc mia)( |$)/.test(t+' ')) return 'snack';
  if (/khu pho am thuc|pho am thuc/.test(t)) return 'snack';
  return 'meal';
};
PV.buildTrip = (o={}) => {
  const pr = PV.state.profile?.prefs || {};
  const custom = pr.time==='other' && pr.time_other ? (pr.time_other.match(/(\d{1,2})\s*(?:h|giờ|:|g)\s*(\d{2})?/i) || null) : null;
  const custom2 = custom ? (pr.time_other.slice(custom.index + custom[0].length).match(/(\d{1,2})\s*(?:h|giờ|:|g)?\s*(\d{2})?/) || null) : null;
  const cStart = custom && +custom[1] < 24 ? String(custom[1]).padStart(2,'0')+':'+(custom[2]||'00') : null;
  const cHours = custom2 && cStart && +custom2[1] < 25 && +custom2[1] > +custom[1] ? (+custom2[1] - +custom[1]) : null;
  const start = PV.toMin(o.start || cStart || (pr.time==='night'?'17:00': pr.time==='evening'?'14:00':'08:00'));
  const hours = o.hours || cHours || (pr.time==='night'||pr.time==='evening' ? 6 : pr.time==='morning' ? 5 : 9);
  const end = start + hours*60;
  const mode = o.mode || (pr.move||[])[0] || 'moto';
  const pace = o.pace || pr.pace || 'normal';
  const maxStops = o.stops || (pace==='many'?8 : pace==='slow'?5 : 6);
  const stayK = pace==='slow' ? 1.4 : pace==='many' ? .85 : 1;
  const radius = pace==='near' || mode==='walk' ? 1.6 : 4.5;
  const w = Object.assign(PV.weights(), o.weights||{});
  const exclude = new Set(o.exclude||[]);
  const must = (o.must||[]).map(PV.byId).filter(Boolean);
  let pool = D.places.filter(p => p.coords && !exclude.has(p.id) && p.geo!=='missing' && (o.filter ? o.filter(p) : true));
  if (o.budget!=null) pool = pool.filter(p => p.price_level==null || p.price_level <= o.budget);
  const scored = new Map(pool.map(p => [p.id, PV.score(p, w)]));
  const og = o.origin || PV.origin(); const origin = og ? og.c : (PV.userPos || null);
  // anchor: must-visit or best near origin / centre
  const centre = [106.6985, 10.7765];
  const inMealAt = (m) => [[6*60+30, 10*60], [10*60+45, 14*60], [17*60, 21*60]].some(([x,y]) => m >= x && m <= y);
  const anchorPool = pool.filter(p => !PV.foodType(p) || (PV.foodType(p) === 'meal' && inMealAt(start)));
  let cur = must[0] || (anchorPool.length ? anchorPool : pool).slice().sort((a,b)=> (scored.get(b.id) - (origin?PV.dist(origin,b.coords)*.25:0)) - (scored.get(a.id) - (origin?PV.dist(origin,a.coords)*.25:0)))[0];
  if (!cur) return null;
  const stops = []; let t = start; let prev = origin;
  const used = new Set();
  // eating rhythm: a real meal at most every ~2.5 h; desserts / snacks need ~45 min after any food, max 2
  const MEALS = [[6*60+30, 10*60, 'Ăn sáng'], [10*60+45, 14*60, 'Ăn trưa'], [17*60, 21*60, 'Ăn tối']];
  const MEAL_GAP = 150, SNACK_GAP = 45, MAX_SNACK = 2;
  let lastMealEnd = -1e9, lastFoodEnd = -1e9, snacks = 0, meals = 0;
  const mealWindow = (m) => MEALS.find(([a,b]) => m >= a && m <= b);
  const addStop = (p) => {
    let leg = null;
    if (prev){ leg = PV.travel(prev, p.coords, mode); t += leg.min; }
    const hrs = PV.parseHours(p);
    let wait = 0;
    if (hrs && t < hrs[0] && hrs[0]-t < 90) { wait = hrs[0]-t; t = hrs[0]; }
    const arrive = t; const stay = Math.round((p.visit_min || 45)*stayK/5)*5; t += stay;
    const ft = PV.foodType(p); let tag = null;
    if (ft === 'meal'){ const mw = mealWindow(arrive); tag = mw ? mw[2] : 'Bữa ăn'; lastMealEnd = t; lastFoodEnd = t; meals++; }
    else if (ft === 'snack'){ tag = arrive >= 13*60+30 && arrive < 17*60+30 ? 'Ăn vặt chiều' : 'Ăn vặt / tráng miệng'; lastFoodEnd = t; snacks++; }
    stops.push({id:p.id, arrive:PV.fmtT(arrive), leave:PV.fmtT(t), stay, leg, by:'ai', tag});
    used.add(p.id); prev = p.coords;
  };
  addStop(cur);
  must.slice(1).forEach(p => { if (!used.has(p.id)) addStop(p); });
  while (stops.length < maxStops && t < end - 30){
    let best=null, bs=-1e9;
    for (const p of pool){
      if (used.has(p.id)) continue;
      const d = PV.dist(prev, p.coords);
      if (d > radius*1.6) continue;
      let s = scored.get(p.id) - d*(mode==='walk'?1.2:.35);
      const tr = PV.travel(prev, p.coords, mode).min, arr = t + tr;
      const ft = PV.foodType(p);
      if (ft === 'meal'){
        const sinceMeal = arr - lastMealEnd, win = mealWindow(arr);
        if (sinceMeal < MEAL_GAP || arr - lastFoodEnd < 60) s -= 100;        // still full – no second meal yet (and not right after a snack)
        else if (win) s += (stops.some(x => x.tag === win[2]) ? -100 : 2.4);   // one breakfast / lunch / dinner each
        else if (!meals && arr - start > 240) s += .8;                        // long trip without food: allow a late meal
        else s -= 100;                                                        // no full meals outside meal times
      } else if (ft === 'snack'){
        if (arr - lastFoodEnd < SNACK_GAP) s -= 100;
        else if (snacks >= MAX_SNACK) s -= 100;
        else if (mealWindow(arr) && !stops.some(x => x.tag === mealWindow(arr)[2]) && arr - lastMealEnd >= MEAL_GAP) s -= 1.5; // it's mealtime: prefer a real meal
        else s += (arr >= 14*60 && arr <= 17*60+30) || arr - lastMealEnd < 120 ? .9 : .2;  // afternoon snack or dessert after a meal
      }
      const hrs = PV.parseHours(p);
      if (hrs && (arr < hrs[0]-60 || arr + 20 > hrs[1])) s -= 3;
      if (/sau giờ học/i.test((p.hours||[]).join(' ')) && arr < 16*60) s -= 3;
      if (s > bs){ bs = s; best = p; }
    }
    if (!best || bs < -50) break;
    addStop(best);
  }
  const total = stops.reduce((a,s)=>a + (s.leg?s.leg.km:0), 0);
  const cost = stops.reduce((a,s)=>{ const p=PV.byId(s.id); return a + ([0,40000,90000,200000][p.price_level ?? 1]); }, 0);
  return {title:o.title || 'Hành trình gợi ý', start:PV.fmtT(start), mode, stops, km:total, cost, created:Date.now(), origin: og ? {name:og.name, c:og.c} : null};
};
PV.retime = (trip) => { // recompute times after manual edits
  let t = PV.toMin(trip.start||'08:00'); let prev = trip.origin ? trip.origin.c : null;
  trip.stops.forEach(s => { const p = PV.byId(s.id); if (!p) return; s.leg = prev ? PV.travel(prev, p.coords, trip.mode) : null; if (s.leg) t += s.leg.min; s.arrive = PV.fmtT(t); s.stay = s.stay || p.visit_min || 45; t += s.stay; s.leave = PV.fmtT(t); prev = p.coords; });
  trip.km = trip.stops.reduce((a,s)=>a+(s.leg?s.leg.km:0),0);
  trip.cost = trip.stops.reduce((a,s)=>{ const p=PV.byId(s.id); return a + ([0,40000,90000,200000][p?.price_level ?? 1]); }, 0);
  return trip;
};
PV.fmtVnd = n => n.toLocaleString('vi-VN') + 'đ';
PV.MODE_IC = {walk:'🚶', moto:'🛵', car:'🚗', taxi:'🚕', bus:'🚌', metro:'🚇'};

PV.dirUrl = (a, b, mode) => `https://www.google.com/maps/dir/?api=1&origin=${a[1]},${a[0]}&destination=${b[1]},${b[0]}&travelmode=${mode==='walk'?'walking':(mode==='bus'||mode==='metro')?'transit':'driving'}`;

/* ---------- MP3 narration (bổ sung sau): audio/<slug>.mp3 next to this HTML file ---------- */
PV.slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

  const draw = () => { const it = items[i]; bg.innerHTML = `<button class="lb-x" aria-label="Đóng">✕</button>${items.length>1?'<button class="lb-prev" aria-label="Ảnh trước">‹</button><button class="lb-next" aria-label="Ảnh sau">›</button>':''}<figure><img src="${it.src}" alt="${esc(it.cap||'')}"><figcaption>${esc(it.cap||'')}${items.length>1?` <span class="tiny">(${i+1}/${items.length})</span>`:''}</figcaption></figure>`; };
  draw(); document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', key); };
  const go = d => { i = (i + d + items.length) % items.length; draw(); };
  const key = e => { if (e.key==='Escape') close(); if (e.key==='ArrowRight') go(1); if (e.key==='ArrowLeft') go(-1); };
  document.addEventListener('keydown', key);
  bg.addEventListener('click', e => { if (e.target.closest('.lb-prev')) go(-1); else if (e.target.closest('.lb-next')) go(1); else if (e.target===bg || e.target.closest('.lb-x')) close(); });

PV.TILES = [
  // Esri first: works without an API key even when the page is opened as a local file (CARTO now answers "API KEY REQUIRED" there)
  {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', o:{maxZoom:19, attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'}},
  {url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', o:{subdomains:'abc', maxZoom:19, attribution:'&copy; OpenStreetMap contributors, Humanitarian OSM Team'}},
  {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', o:{maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}},
  {url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', o:{subdomains:'abcd', maxZoom:20, attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}}
];
PV.baseLayer = (mp) => {
  let i = PV.tileIdx || 0, cur = null, dead = false; const status = [];
  mp.on('unload', () => { dead = true; });
  const NAMES = ['Esri','OSM Humanitarian','OpenStreetMap','CARTO'];
  const showFail = () => {
    const el = mp.getContainer(); const old = el.querySelector('.tilefail'); if (old) old.remove();
    el.insertAdjacentHTML('beforeend', `<div class="tilefail"><b>Không tải được nền bản đồ</b><div class="small" style="margin:6px 0">Các ghim địa điểm vẫn dùng được. Trình duyệt đang chặn ảnh bản đồ từ Internet.</div>
      <ul class="tiny" style="text-align:left;margin:6px 0 8px;padding-left:18px">${status.map(s=>`<li>${s}</li>`).join('')}</ul>
      <div class="tiny muted" style="margin-bottom:8px">Gợi ý: mở file bằng <b>Google Chrome</b>, hoặc trong Edge vào Cài đặt → Quyền riêng tư → tắt "Ngăn chặn theo dõi" (Tracking prevention) cho trang này, rồi bấm Thử lại.</div>
      <button class="btn sm" id="tileRetry">Thử lại</button></div>`);
    const r = el.querySelector('#tileRetry'); if (r) r.onclick = (e) => { e.stopPropagation(); el.querySelector('.tilefail').remove(); status.length = 0; i = 0; PV.tileIdx = 0; use(); };
  };
  const use = () => {
    if (dead) return;
    if (cur) { try { mp.removeLayer(cur); } catch(e){} cur = null; }
    if (i >= PV.TILES.length){ showFail(); return; }
    const t = PV.TILES[i]; let ok = 0, bad = 0, switching = false;
    const layer = L.tileLayer(t.url, t.o);
    const next = (why) => { if (switching || dead || cur !== layer) return; switching = true; status.push(NAMES[i] + ': ' + why);
      layer.off('tileload', onLoad); layer.off('tileerror', onErr); clearTimeout(timer);
      const go = () => { if (mp._animatingZoom){ mp.once('zoomend', go); return; } i++; use(); }; setTimeout(go, 0); };
    const onLoad = () => { ok++; PV.tileIdx = i; clearTimeout(timer); };
    const onErr = () => { bad++; if (ok === 0 && bad >= 3) next('bị chặn / lỗi'); };
    // some browsers neither load nor fail (request hangs): give each server 6 s to deliver a first tile
    const timer = setTimeout(() => { if (ok === 0) next('không phản hồi (treo)'); }, 6000);
    layer.on('tileload', onLoad); layer.on('tileerror', onErr);
    cur = layer; layer.addTo(mp);
  };
  use();
};

function visible(p){

    html:`<div class="pin" style="width:${s}px;height:${s}px;border-width:${bw}px;background:${c.color};${state.visited[p.id]?'outline:'+(s<18?2:3)+'px solid #1F4E79;':''}">${s>=18?`<span style="font-size:${fs}px">${c.emoji}</span>`:''}</div>`});

function search(q, live){

   <label class="small">Tên hành trình<input class="input" id="dn" value="${esc(t.title)}"></label>
   <label class="small" style="display:block;margin-top:8px">Ngày đi<input class="input" type="date" id="dd" value="${new Date().toISOString().slice(0,10)}"></label>
   <label class="small" style="display:block;margin-top:8px">Cảm nhận của bạn<textarea class="input" id="dt" rows="3" placeholder="Điều bạn nhớ nhất trong chuyến đi…"></textarea></label>
   <label class="small" style="display:block;margin-top:8px">Ảnh bìa (tùy chọn)<input type="file" accept="image/*" id="df"></label>
   <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-close>Hủy</button><button class="btn" id="dok">Lưu</button></div>`, (box, close) => {
    $('#dok',box).onclick = async () => {
      let img = null; const f = $('#df',box).files[0]; if (f) img = await PV.shrink(f, 480);
      state.diaries.unshift({id:'d'+Date.now(), title:$('#dn',box).value, date:$('#dd',box).value, note:$('#dt',box).value, img, stops:t.stops.map(s=>s.id)});
      PV.save('diaries'); PV.addPoints(15,'Lưu nhật ký hành trình'); close(); location.hash='#profile';
    };
  });
};
PV.shrink = (file, max) => new Promise(res => { const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*k; c.height=im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.72)); }; im.onerror=()=>res(null); im.src=r.result; }; r.readAsDataURL(file); });
PV.modal = (html, bind) => {
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal" role="dialog">${html}</div>`; document.body.appendChild(bg);
  const close = () => bg.remove(); bg.addEventListener('click', e => { if (e.target===bg || e.target.hasAttribute('data-close')) close(); });
  if (bind) bind(bg, close); return close;
};

PV.badges = () => {
  const v = Object.keys(state.visited).map(PV.byId).filter(Boolean);
  const n = c => v.filter(p=>p.cats.includes(c)).length;
  return [
    {id:'b1', e:'🏛️', name:'Nhà sử học nhí', need:'Ghé 5 địa điểm lịch sử – văn hóa', cur:n('history'), max:5},

    {id:'b3', e:'⭐', name:'Thợ săn Michelin', need:'Ghé 2 quán được Michelin Guide giới thiệu', cur:v.filter(p=>p.michelin).length, max:2},
    {id:'b4', e:'🛍️', name:'Tín đồ quà lưu niệm', need:'Ghé 3 cửa hàng quà – đặc sản', cur:n('shopping'), max:3},
    {id:'b5', e:'📸', name:'Thợ săn góc chụp', need:'Ghé 4 điểm kiến trúc – check-in', cur:n('checkin'), max:4},
    {id:'b6', e:'🛣️', name:'Lãng du tên đường', need:'Khám phá câu chuyện của 8 tên đường', cur:Object.keys(state.readStreets).length, max:8},
    {id:'b7', e:'📔', name:'Người giữ kỷ niệm', need:'Lưu 1 nhật ký hành trình', cur:state.diaries.length, max:1},
    {id:'b8', e:'🎧', name:'Người lắng nghe', need:'Nghe 3 bài thuyết minh', cur:state.listened, max:3}
  ].map(b => ({...b, got:b.cur>=b.max}));
};
PV.views.collection = (m) => {
  const all = D.places.filter(p=>p.cats.includes('history') || p.michelin || p.kind==='Thời trang' || p.cats.includes('shopping')).slice(0,40);
  const got = Object.keys(state.visited).length; const total = D.places.length;
  m.innerHTML = `<h1 class="title">Bộ sưu tập Sài Gòn</h1><p class="sub">Mỗi nơi bạn ghé thăm là một dấu mộc điện tử. Hoàn thành chủ đề để mở khóa huy hiệu.</p>
  <div class="card"><div class="row"><b>Tiến độ khám phá</b><span class="spacer"></span><span class="muted small">${got}/${total} địa điểm · ${state.points} điểm</span></div><div class="bar" style="margin-top:8px"><i style="width:${Math.round(got/total*100)}%"></i></div></div>
  <h3 style="margin-top:22px">Huy hiệu</h3><div class="badges">${PV.badges().map(b=>`<div class="badge ${b.got?'got':''}"><div class="e">${b.e}</div><b>${b.name}</b><div class="tiny muted">${b.need}</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,b.cur/b.max*100)}%"></i></div><div class="tiny">${Math.min(b.cur,b.max)}/${b.max}</div></div>`).join('')}</div>
  <h3 style="margin-top:22px">Dấu mộc đã nhận</h3>
  <div class="stamps">${Object.keys(state.visited).map(PV.byId).filter(Boolean).map(p=>`<div class="stamp got ${PV.mainCat(p)}" data-pid="${p.id}">${esc(p.name)}<br><span class="tiny">${esc(state.visited[p.id])}</span></div>`).join('') || '<div class="empty">Chưa có dấu mộc. Khi đến một địa điểm, mở thông tin và bấm “Tôi đã ghé thăm”.</div>'}</div>
  <h3 style="margin-top:22px">Dấu mộc đang chờ bạn</h3>
  <div class="stamps">${all.filter(p=>!state.visited[p.id]).map(p=>`<div class="stamp" data-pid="${p.id}">${esc(p.name)}</div>`).join('')}</div>`;
  PV.bindItems(m);
};
})();

function seg(s){ // translate " · " separated pieces and emoji-prefixed pieces
  if (s.includes(' · ')){ const parts = s.split(' · '); const t = parts.map(tr1); if (t.some((x,i)=>x!==parts[i])) return t.join(' · '); }

  return null;
}

function trNode(n){
  const v = n.nodeValue; if (!v || !/\S/.test(v)) return;
  if (n.__en === v) return; // already translated by us
  const core = v.replace(/\s+/g,' ').trim();
  let r = tr1(core); if (r===core) r = phrase(core);

}
const ATTRS = ['placeholder','title','aria-label'];
function trEl(el){ ATTRS.forEach(a => { const v = el.getAttribute && el.getAttribute(a); if (!v) return; el.__via = el.__via || {}; if (el.__via[a+'_en']===v) return; const r = tr1(v.trim()); if (r!==v.trim()){ el.__via[a]=v; el.__via[a+'_en']=r; el.setAttribute(a, r); } }); }

  if (root.nodeType===3){ trNode(root); return; }

  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  let n; while (n = w.nextNode()){ if (n.nodeType===3){ const p=n.parentElement; if (p && !p.closest('script,style,.notr')) trNode(n); } else trEl(n); }
}
function restore(){
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);

/* ---------- accounts on this device: log out / switch user ---------- */
PV.USER_KEYS = ['profile','trip','visited','diaries','readStreets','listened','points','chat','history','toured','badgesSeen'];
PV.accounts = () => PV.store.get('accounts', {});
PV.snapshot = () => { const o={}; PV.USER_KEYS.forEach(k => { o[k] = k in state ? state[k] : PV.store.get(k, null); }); return o; };
PV.restore = (snap) => {
  PV.USER_KEYS.forEach(k => { if (snap[k]==null) { PV.store.del(k); if (k in state) state[k] = defaults()[k]; } else { PV.store.set(k, snap[k]); if (k in state) state[k] = snap[k]; } });
};
function defaults(){ return {profile:null, trip:{title:'Hành trình của tôi', start:'08:00', mode:'moto', stops:[]}, visited:{}, diaries:[], readStreets:{}, listened:0, points:0, chat:[], history:[]}; }
PV.logout = (keep) => {
  const p = state.profile;
  if (keep && p && p.name){
    const accs = PV.accounts(); const key = (p.uid ||= 'u'+Date.now());
    accs[key] = {name:p.name, avatar:p.avatar||null, persona:p.persona?.name||'', savedAt:new Date().toLocaleString('vi-VN'), data:PV.snapshot(), theme:state.settings.theme||{id:'default'}};
    try { PV.store.set('accounts', accs); } catch(e){}
    // localStorage can be full (diary photos): retry without photos
    if (!PV.store.get('accounts',{})[key]) { accs[key].data.diaries = (accs[key].data.diaries||[]).map(d=>({...d, img:null})); PV.store.set('accounts', accs); }
  }
  PV.restore(defaults());
  state.settings.guide = null; state.settings.theme = {id:'default'}; PV.save('settings'); // logged-out = default white–blue
  PV.applyTheme && PV.applyTheme({id:'default'});
  if (window.speechSynthesis) speechSynthesis.cancel();
  location.hash = '#home'; PV.route(); PV.welcome(true);
};
PV.login = (key) => {
  const accs = PV.accounts(); const a = accs[key]; if (!a) return;
  PV.restore(a.data); state.profile.onboarded = true; PV.save('profile');
  const th = a.theme || {id:'default'}; state.settings.theme = th; PV.save('settings'); // bring back this account's own background
  PV.applyTheme && PV.applyTheme(th);
};
PV.forgetAccount = (key) => { const accs = PV.accounts(); delete accs[key]; PV.store.set('accounts', accs); };

/* shared chat engine: works inside any root that has .msgs, .sugg, .composer (full page or floating popup) */
PV.chatCore = (root) => {
  const q = s => root.querySelector(s);
  const msgs = q('.msgs'), ci = q('.composer input');
  const g = PV.todayGuide();
  if (!state.chat.length) state.chat.push({r:'bot', t:`${PV.L(g.greet, PV.tr(g.greet))}\n${state.profile?.persona ? PV.L('Mình thấy bạn là “'+state.profile.persona.name+'”. ', 'I see you are a “'+PV.tr(state.profile.persona.name)+'”. ') : ''}${PV.L('Bạn muốn mình lên lịch trình, gợi ý quán ăn hay kể chuyện về một địa danh nào?','Would you like me to plan a trip, suggest places to eat or tell you about a landmark?')}`, g:g.id});
  msgs.innerHTML = '';
  state.chat.forEach(c => msgs.insertAdjacentHTML('beforeend', bubble(c)));
  bindCards(msgs); msgs.scrollTop = msgs.scrollHeight;
  // easy scrolling: wheel / touchpad / touch, plus drag with the mouse, and a "jump to latest" button
  msgs.tabIndex = 0;
  if (!msgs._dragBound){ msgs._dragBound = true;
    let down = false, y0 = 0, s0 = 0, moved = false;
    msgs.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('button,a,input,textarea,.pitem,[data-pid]')) return; down = true; moved = false; y0 = e.clientY; s0 = msgs.scrollTop; });
    window.addEventListener('pointermove', e => { if (!down) return; const dy = e.clientY - y0; if (Math.abs(dy) > 4){ moved = true; msgs.classList.add('dragging'); } msgs.scrollTop = s0 - dy; });
    window.addEventListener('pointerup', () => { if (down){ down = false; msgs.classList.remove('dragging'); } });
    msgs.addEventListener('click', e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    const jump = document.createElement('button'); jump.type = 'button'; jump.className = 'msgs-jump'; jump.textContent = '↓'; jump.title = PV.L('Tin mới nhất','Latest message');
    jump.onclick = () => msgs.scrollTo({top: msgs.scrollHeight, behavior: 'smooth'});
    if (getComputedStyle(msgs.parentElement).position === 'static') msgs.parentElement.style.position = 'relative';
    msgs.after(jump);
    const upd = () => jump.classList.toggle('on', msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight > 80);
    msgs.addEventListener('scroll', upd, {passive:true}); setTimeout(upd, 50);
  }
  root.querySelectorAll('.sugg .chip').forEach(b => b.onclick = () => send(b.textContent.replace(/^\S+\s/,'')));
  q('.composer').onsubmit = e => { e.preventDefault(); const v=ci.value.trim(); if (v){ ci.value=''; send(v); } };
  if (PV.pendingAsk){ const t=PV.pendingAsk; PV.pendingAsk=null; setTimeout(()=>send(t),200); }
  async function send(text){
    const me = {r:'me', t:text}; state.chat.push(me); msgs.insertAdjacentHTML('beforeend', bubble(me));
    const ty = document.createElement('div'); ty.className='msg'; ty.innerHTML=`<div class="av">${PV.robot(PV.todayGuide(),{wave:false})}</div><div class="bubble typing"><span></span><span></span><span></span></div>`; msgs.appendChild(ty); msgs.scrollTop=msgs.scrollHeight;
    let res; try { res = await PV.answer(text); } catch(e){ res = PV.localAnswer(text); res.t = PV.L('(Không kết nối được AI, mình trả lời bằng kho dữ liệu.)\n','(Could not reach the AI, answering from the database.)\n') + res.t; }
    ty.remove(); res.r='bot'; res.g=PV.todayGuide().id; state.chat.push(res); state.chat = state.chat.slice(-60); PV.save('chat');
    if (!document.body.contains(msgs)) return;
    msgs.insertAdjacentHTML('beforeend', bubble(res)); bindCards(msgs); msgs.scrollTop=msgs.scrollHeight;
  }
  function bindCards(r){
    $$('[data-pid]', r).forEach(el => el.onclick = () => { if (PV._mapRef && PV.focusPlace && location.hash==='#map') PV.focusPlace(el.dataset.pid); else PV.openPlace(el.dataset.pid); });
    $$('[data-usetrip]', r).forEach(b => b.onclick = () => { const c = state.chat[+b.dataset.usetrip]; if (!c||!c.trip) return; state.trip = JSON.parse(JSON.stringify(c.trip)); state.trip.stops.forEach(s=>s.by='ai'); PV.retime(state.trip); PV.save('trip'); PV.toast('Đã lưu lịch trình'); if (location.hash==='#map' && PV.refreshMapTrip) PV.refreshMapTrip(); else location.hash='#trip'; });
    $$('[data-adjust]', r).forEach(b => b.onclick = () => { ci.value='Mình muốn điều chỉnh: '; ci.focus(); });
    $$('[data-say2]', r).forEach(b => b.onclick = () => { const c=state.chat[+b.dataset.say2]; if (c) PV.speak(c.t.replace(/[*_#>]/g,''), b); });
  }
  function bubble(c){
    const idx = state.chat.indexOf(c);
    if (c.r==='me') return `<div class="msg me"><div class="bubble">${esc(c.t)}</div></div>`;
    const g = PV.GUIDES.find(x=>x.id===c.g) || PV.todayGuide();
    let extra = '';
    if (c.places && c.places.length) extra += `<div class="plist" style="margin-top:8px">${c.places.map(PV.byId).filter(Boolean).map(PV.pitem).join('')}</div>`;
    if (c.trip) extra += `<div class="tripcard"><b>🗺️ ${esc(c.trip.title)}</b><div class="tiny muted">Bắt đầu ${c.trip.start} · ${PV.MODES[c.trip.mode]?.name||''} · ~${PV.fmtKm(c.trip.km||0)} · ~${PV.fmtVnd(c.trip.cost||0)}/người</div>
      <ol>${c.trip.stops.map(s=>{const p=PV.byId(s.id); return p?`<li><b>${s.arrive||''}</b> <span data-pid="${p.id}" style="cursor:pointer;text-decoration:underline dotted">${esc(p.name)}</span>${s.tag?` <span class="tag meal">${s.tag.startsWith('Ăn vặt')?'🍡':'🍽️'} ${esc(s.tag)}</span>`:''} <span class="tiny muted">(${s.stay||p.visit_min} phút${s.leg?' · đi '+s.leg.min+' phút':''})</span></li>`:'';}).join('')}</ol>
      <div class="row"><button class="btn sm" data-usetrip="${idx}">Lưu lịch trình</button><button class="btn ghost sm" data-adjust="${idx}">Điều chỉnh lịch trình</button></div></div>`;
    if (c.sources && c.sources.length) extra += `<div class="src">📚 Nguồn tham khảo: ${c.sources.map(s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)).join(' · ')}</div>`;
    return `<div class="msg"><div class="av">${PV.robot(g,{wave:false})}</div><div class="bubble">${esc(c.t)}${extra}<div style="margin-top:6px"><button class="btn ghost sm" data-say2="${idx}" title="Nghe">${ICON.speaker.replace('<svg','<svg width=14 height=14')}</button></div></div></div>`;
  }
};

/* ---------- answer engines ---------- */
PV.answer = async (text) => {
  const key = state.settings.apiKey;
  let sampler = null;
  try { if (window.claude && window.claude.use) sampler = await window.claude.use('sample'); } catch(e){}
  if (!key && !sampler) return PV.localAnswer(text);
  const sys = PV.systemPrompt();
  const hist = state.chat.slice(-12).filter(c=>c.t).map(c=>({role:c.r==='me'?'user':'assistant', content:c.t}));
  if (!hist.length || hist[hist.length-1].role!=='user') hist.push({role:'user', content:text});
  while (hist.length && hist[0].role!=='user') hist.shift();
  let raw;
  if (sampler){ const r = await sampler([{role:'user', content: sys + '\n\n=== CUỘC TRÒ CHUYỆN ===\n' + hist.map(h=>(h.role==='user'?'Người dùng: ':'Hướng dẫn viên: ')+h.content).join('\n') + '\n\nTrả lời đúng định dạng JSON.'}], {cache:false}); raw = r.text; }
  else {
    const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model: state.settings.model || 'claude-sonnet-5-5', max_tokens: 1500, system: sys, messages: hist})});
    if (!r.ok) throw new Error('API '+r.status);
    const j = await r.json(); raw = (j.content||[]).map(c=>c.text||'').join('');
  }
  const m = raw.match(/\{[\s\S]*\}/); let o;
  try { o = JSON.parse(m ? m[0] : raw); } catch(e){ return {t: raw.trim()}; }
  const out = {t: o.reply || '…'};
  const ok = id => !!PV.byId(id);
  if (Array.isArray(o.place_ids)) out.places = o.place_ids.filter(ok).slice(0,6);
  if (o.itinerary && Array.isArray(o.itinerary.stops) && o.itinerary.stops.length){
    const ids = o.itinerary.stops.filter(ok);
    const trip = PV.buildTrip({must: ids, stops: ids.length, start: o.itinerary.start || undefined, mode: o.itinerary.mode || undefined, title: o.itinerary.title});
    if (trip){ trip.stops = trip.stops.filter(s => ids.includes(s.id)); trip.stops.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); trip.start = o.itinerary.start || trip.start; PV.retime(trip); out.trip = trip; }
  }
  if (Array.isArray(o.sources)) out.sources = o.sources.filter(s=>s&&s.name).slice(0,4);
  return out;
};

QUY TẮC: Chỉ dùng thông tin trong KHO DỮ LIỆU bên dưới cho giá vé, giờ mở cửa, địa chỉ. Không bịa thông tin lịch sử; nếu không chắc, nói rõ "thông tin này chưa được xác minh". Với địa điểm có "vị trí gần đúng", nhắc người dùng kiểm tra lại. Trước khi lập lịch trình, nếu chưa biết thời gian, ngân sách hoặc khu vực, hãy hỏi lại 1–2 câu ngắn (không hỏi trùng điều đã biết trong hồ sơ). Khi kể chuyện lịch sử/địa danh, thêm nguồn tham khảo.

LỊCH TRÌNH HIỆN TẠI: ${state.trip.stops.map(s=>PV.byId(s.id)?.name).filter(Boolean).join(' → ') || 'trống'}.
KHO DỮ LIỆU ĐỊA ĐIỂM (id | tên | loại | địa chỉ | giá | giờ | ...):
${cat}
KHO TÊN ĐƯỜNG:
${st}
ĐỊNH DẠNG TRẢ LỜI: chỉ một đối tượng JSON, không thêm chữ nào khác:
{"reply":"lời nói của bạn","place_ids":["id địa điểm muốn giới thiệu (tối đa 5)"],"itinerary":null hoặc {"title":"...","start":"HH:MM","mode":"walk|moto|taxi|bus","stops":["id theo thứ tự"]},"sources":[{"name":"tên nguồn","url":"đường dẫn nếu có"}]}`;
};

/* local rule-based engine – works offline with the dataset (Vietnamese + English) */
PV.localAnswer = (text) => {
  const L = PV.L, n = PV.norm(text);
  const has = (...w) => w.some(x => n.includes(x));
  const nm = p => L(p.name, p.name_en || p.name);
  const kind = p => PV.tr(p.kind);
  // adjust last trip
  const last = [...state.chat].reverse().find(c=>c.trip);
  if (last && (has('bo ','khong muon','thay ','doi ','dieu chinh','di bo thoi','them quan','them diem','remove','skip','drop','instead','adjust','change','add food','add a','walk only') || n.startsWith('bo '))) {
    const del = has('bo','khong muon','thay','doi','remove','skip','drop','instead');
    const ex = last.trip.stops.map(s=>s.id).filter(id => { const p=PV.byId(id); return del && (n.includes(PV.norm(p.name.split(/[–(-]/)[0].trim())) || (p.name_en && n.includes(PV.norm(p.name_en.split('(')[0].trim())))); });
    const keep = last.trip.stops.map(s=>s.id).filter(id=>!ex.includes(id));
    const o = {must: keep, exclude: ex, start: last.trip.start, mode: has('di bo','walk')?'walk':last.trip.mode, stops: Math.max(keep.length + (has('them','add')?1:0) + ex.length, 3)};
    if (has('them quan','an uong','an gi','food','eat')) o.weights = {food:2.5};
    const trip = PV.buildTrip(o); if (trip) { trip.title = last.trip.title.replace(/ \((đã điều chỉnh|adjusted)\)$/,'') + L(' (đã điều chỉnh)',' (adjusted)');
      return {t: L(`Mình đã điều chỉnh lịch trình${ex.length?' – bỏ '+ex.map(id=>PV.byId(id).name).join(', '):''}. Thời gian và quãng đường đã được tính lại.`, `I've adjusted the itinerary${ex.length?' – removed '+ex.map(id=>nm(PV.byId(id))).join(', '):''}. Times and distances have been recalculated.`), trip}; }
  }
  // street story
  const st = D.streets.find(s => n.includes(PV.norm(s.name)) && has('duong','ten duong','y nghia','vi sao','tai sao','street','mean','name','story','why'));
  if (st) { PV.markStreet(st.id);
    return {t: L(`Đường ${st.name} (phường ${st.wards}): ${st.story}\nBạn muốn xem con đường này trên bản đồ? Vào “Bản đồ khám phá” và gõ tên đường nhé!`, `${st.name} Street (${st.wards} ward): ${st.story_en||st.story}\nWant to see it on the map? Open “Explore map” and type the street name!`),
      sources:[{name:L('Tư liệu tên đường – nhóm Personavel tổng hợp','Street notes – compiled by the Personavel team')}]}; }
  // specific place
  const keyOf = p => [PV.norm(p.name.split(/[–(-]/)[0].trim()), p.name_en ? PV.norm(p.name_en.split('(')[0].trim()) : null].filter(Boolean);
  const pl = D.places.slice().sort((a,b)=>b.name.length-a.name.length).find(p => keyOf(p).some(k => k.length>3 && n.includes(k)));
  if (pl && !has('lich trinh','ke hoach','itinerary','plan')) {
    const hours = L((pl.hours||[])[0], (pl.hours_en||[])[0] || PV.tr((pl.hours||[])[0]));
    const price = L((pl.price||[])[0], (pl.price_en||[])[0] || PV.tr((pl.price||[])[0])) || PV.tr(PV.priceText(pl.price_level));
    const hl = L(pl.highlights, pl.highlights_en || pl.highlights) || [];
    const t = `${nm(pl)}: ${L(pl.desc, pl.desc_en || PV.tr(pl.desc))}\n📍 ${pl.address}\n🕒 ${hours||L('Giờ mở cửa chưa xác minh','Opening hours not verified')}\n🎟️ ${price}${hl.length?'\n✨ '+hl.slice(0,3).join(', '):''}${pl.geo==='approx'?L('\n(Lưu ý: vị trí trên bản đồ là gần đúng, bạn nên kiểm tra lại.)','\n(Note: the map position is approximate, please double-check.)'):''}`;
    return {t, places:[pl.id], sources:[pl.source?{name:pl.source_name,url:pl.source}:{name:PV.tr(pl.source_name||'Khảo sát của nhóm')}]};
  }
  // itinerary
  if (has('lich trinh','ke hoach','len lich','hanh trinh','di dau','1 ngay','mot ngay','nua ngay','buoi sang','buoi toi','buoi chieu','toi nay','itinerary','plan','trip','schedule','one day','1 day','half day','tonight','evening','morning','afternoon','where to go')) {
    const o = {};
    if (has('buoi toi','toi nay','dem','buoi dem','evening','tonight','night')) { o.start='17:30'; o.hours=5; }
    else if (has('buoi chieu','afternoon')) { o.start='14:00'; o.hours=5; }
    else if (has('buoi sang','nua ngay','morning','half day')) { o.start='07:30'; o.hours=4.5; }
    const tm = text.match(/(\d{1,2})\s*(h|giờ|:|am|pm)\s*(\d{2})?/i); if (tm && +tm[1]<24) { let h=+tm[1]; if (/pm/i.test(tm[2]) && h<12) h+=12; o.start = String(h).padStart(2,'0')+':'+(tm[3]||'00'); }
    if (has('tiet kiem','re','sinh vien','it tien','cheap','budget','student')) o.budget = 1;
    if (has('di bo','walk')) o.mode='walk'; else if (has('taxi','grab')) o.mode='taxi'; else if (has('xe may','motorbike','scooter')) o.mode='moto';
    const w = {};
    if (has('an uong','am thuc','an ngon','quan an','food','eat')) w.food = 2.2;
    if (has('lich su','van hoa','bao tang','di tich','history','culture','museum')) w.history = 2.2;
    if (has('check in','chup anh','song ao','photo','instagram')) w.checkin = 2.2;
    if (has('mua sam','qua','luu niem','thoi trang','shopping','souvenir','gift','fashion')) w.shopping = 2.2;
    o.weights = w;
    const trip = PV.buildTrip(o);
    if (!trip) return {t:L('Mình chưa tìm được lịch trình phù hợp. Bạn thử nói rõ hơn khung giờ hoặc sở thích nhé!','I could not find a suitable itinerary. Try telling me the time of day or what you like!')};
    const night = o.start && PV.toMin(o.start) >= 17*60;
    trip.title = night ? L('Sài Gòn về đêm','Saigon by night') : L('Một ngày khám phá Sài Gòn','A day exploring Saigon');
    const per = state.profile?.persona;
    return {t: L(`Mình đã lên lịch trình ${trip.stops.length} điểm, bắt đầu lúc ${trip.start}, di chuyển bằng ${PV.MODES[trip.mode].name.toLowerCase()}. Các điểm được chọn theo ${per?'phong cách “'+per.name+'”':'những địa điểm nổi bật'}, ưu tiên gần nhau và xếp bữa ăn vào khung trưa/tối.${!state.profile?.prefs?'\nGợi ý: hãy làm bài phân tích phong cách (trong Trang cá nhân) để mình đề xuất chính xác hơn.':''}\nBạn có thể lưu, hoặc nói “bỏ [tên địa điểm]”, “thêm quán ăn”, “đi bộ thôi”… để mình điều chỉnh.`,
      `I've planned a ${trip.stops.length}-stop itinerary starting at ${trip.start}, travelling by ${PV.tr(PV.MODES[trip.mode].name).toLowerCase()}. Stops are chosen for ${per?'your “'+PV.tr(per.name)+'” style':'their highlights'}, kept close together, with meals at lunch/dinner time.${!state.profile?.prefs?'\nTip: take the style analysis (in My profile) for better suggestions.':''}\nYou can save it, or say “remove [place]”, “add food”, “walk only”… and I'll adjust it.`), trip};
  }
  // category suggestions
  const near = has('gan day','gan toi','quanh day','gan nhat','near','nearby','around');
  const pick = (f, k=4) => { let arr = D.places.filter(p=>p.coords && f(p)); if (near && PV.userPos) arr.sort((a,b)=>PV.dist(PV.userPos,a.coords)-PV.dist(PV.userPos,b.coords)); else arr.sort((a,b)=>PV.score(b)-PV.score(a)); return arr.slice(0,k).map(p=>p.id); };
  const gps = near && !PV.userPos ? L(' (bật “Vị trí của tôi” trên bản đồ để mình xếp theo khoảng cách)',' (turn on “My location” on the map so I can sort by distance)') : '';
  const DISH = {'pho':'phở','banh mi':'bánh mì','bun bo':'bún bò','bun cha':'bún chả','com tam':'cơm tấm','che':'chè','oc':'ốc','banh xeo':'bánh xèo','xoi':'xôi','hu tieu':'hủ tiếu','chao':'cháo','lau':'lẩu','banh trang':'bánh tráng','sup cua':'súp cua','banh flan':'bánh flan','bot chien':'bột chiên','chay':'chay','bo kho':'bò kho','banh beo':'bánh bèo','bach tuoc':'bạch tuộc','mi ':'mì','noodle':'mì','vegetarian':'chay','vegan':'chay','snail':'ốc','sandwich':'bánh mì','broken rice':'cơm tấm','pancake':'bánh xèo','sticky rice':'xôi','dessert':'chè','soup':'súp cua','hotpot':'lẩu'};
  const dk = Object.keys(DISH).find(d => (' '+n+' ').includes(d.trim()==='mi'?' mi ':d) );
  if (dk) { const dn = PV.norm(DISH[dk]); const ids = pick(p=>p.cats.includes('food') && PV.norm(p.name+' '+(p.highlights||[]).join(' ')).includes(dn), 5); if (ids.length) return {t: L(`Món “${DISH[dk]}” thì bạn có thể thử những quán này${gps}:`, `For “${DISH[dk]}”, try these places${gps}:`), places:ids}; }
  // dish name typed by the user ("bún riêu", "milo dầm", "bánh tiêu"…) → places whose name / signature dishes contain it
  { const GEN = new Set(['quan','goi','y','an','ngon','o','dau','gan','day','minh','muon','cho','nao','di','toi','ban','co','khong','the','nhat','tim','thu','mon','nhung','cac','va','voi','la','o?']);
    const w = n.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean); const grams = [];
    for (let i=0;i<w.length-1;i++){ if (!GEN.has(w[i]) && !GEN.has(w[i+1])) grams.push(w[i]+' '+w[i+1]); }
    if (grams.length && !has('mua qua','luu niem','mua sam','shopping','souvenir','qua tang')){
      const hits = D.places.filter(p => p.cats.includes('food')).map(p => { const hay = ' '+PV.norm([p.name, ...(p.highlights||[])].join(' | ')).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ')+' '; return [p, grams.filter(g => hay.includes(' '+g+' ')).length]; }).filter(x => x[1]>0).sort((a,b)=>b[1]-a[1]);
      if (hits.length) return {t:L(`Món bạn hỏi có ở ${hits.length>1?'những quán này':'quán này'} nè:`, `You can find that dish here:`), places: hits.slice(0,5).map(x=>x[0].id)};

/* ---------- celebrate: the guide pops up when a collection badge is completed ---------- */
PV.checkBadges = () => {
  if (!state.profile) return;
  const got = PV.badges().filter(b=>b.got);
  let seen = PV.store.get('badgesSeen', null);
  if (!Array.isArray(seen)) { PV.store.set('badgesSeen', got.map(b=>b.id)); return; } // first run: no retro party
  const fresh = got.filter(b => !seen.includes(b.id));
  if (!fresh.length) return;
  PV.store.set('badgesSeen', [...seen, ...fresh.map(b=>b.id)]);
  setTimeout(() => PV.celebrate(fresh), 900);
};
PV.celebrate = (list) => {
  const old = document.getElementById('celebrate'); if (old) old.remove();
  const g = PV.todayGuide(); const name = state.profile?.name || PV.L('bạn','friend');
  const all = PV.badges(); const done = all.filter(b=>b.got).length;
  const next = all.filter(b=>!b.got).sort((a,b)=>(b.cur/b.max)-(a.cur/a.max))[0];
  const bn = b => `${b.e} <b>${esc(PV.tr(b.name))}</b>`;
  const ov = document.createElement('div'); ov.className = 'celebrate-ov'; ov.id = 'celebrate'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML = `<div class="confetti" aria-hidden="true">${Array.from({length:60},(_,i)=>`<i style="left:${(i*37+11)%100}%;background:${['#2F6FA3','#D62839','#F4C430','#7FC3EA','#1F4E79','#F28C8C'][i%6]};animation-delay:${1+(i%9)*.13}s;animation-duration:${2.2+(i%5)*.35}s"></i>`).join('')}</div>
    <div class="cel-box">
      <div class="cel-bot">${PV.robot(g)}<div class="cel-badge">${list[0].e}</div></div>
      <div class="cel-card">
        <button class="cel-x" aria-label="Đóng">✕</button>
        <div class="cel-title">🎉 ${PV.L('Chúc mừng','Congratulations')} ${esc(name)}!</div>
        <div>${PV.L('Bạn vừa hoàn thành mục','You just completed')} ${list.map(bn).join(', ')} ${PV.L('trong Bộ sưu tập Sài Gòn.','in the Saigon Collection.')}</div>
        <div class="tiny muted" style="margin-top:4px">${list.map(b=>esc(PV.tr(b.need))).join(' · ')}</div>
        <div style="margin-top:8px">${done===all.length ? PV.L('Bạn đã sưu tập đủ tất cả huy hiệu – một nhà khám phá Sài Gòn thực thụ! 🏆','You have collected every badge – a true Saigon explorer! 🏆')
          : PV.L(`Bạn đã có ${done}/${all.length} huy hiệu.`, `You now have ${done}/${all.length} badges.`) + (next ? ' ' + PV.L('Mục gần xong nhất:','Closest next:') + ` ${bn(next)} (${Math.min(next.cur,next.max)}/${next.max}).` : '')}</div>
        <div class="gp-acts" style="justify-content:center"><button class="btn sm" data-ca="coll">🏅 ${PV.L('Xem bộ sưu tập','View collection')}</button><button class="btn sm ghost" data-ca="map">📍 ${PV.L('Khám phá tiếp','Keep exploring')}</button></div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => { ov.classList.add('out'); setTimeout(()=>ov.remove(), 300); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key==='Escape') close(); }; document.addEventListener('keydown', esc_);
  ov.addEventListener('click', e => { if (e.target===ov) close(); });
  ov.querySelector('.cel-x').onclick = close;
  ov.querySelectorAll('[data-ca]').forEach(b => b.onclick = () => { close(); const h = b.dataset.ca==='coll' ? '#collection' : '#map'; if (location.hash===h) PV.route(); else location.hash = h; });

PV.sfx = (() => {

  const on = () => !(state.settings && state.settings.sound === false);
  const bell = (c, t, f, g, d) => { const o = c.createOscillator(), gg = c.createGain(); o.type='sine'; o.frequency.value=f;
    gg.gain.setValueAtTime(.0001,t); gg.gain.exponentialRampToValueAtTime(g,t+.02); gg.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gg).connect(c.destination); o.start(t); o.stop(t+d+.05); };
  const puff = (c, t, g) => { const n = noise(c,.6), f = c.createBiquadFilter(), gg = c.createGain(); f.type='lowpass'; f.frequency.value=700;
    gg.gain.setValueAtTime(.0001,t); gg.gain.exponentialRampToValueAtTime(g,t+.03); gg.gain.exponentialRampToValueAtTime(.0001,t+.55); n.connect(f).connect(gg).connect(c.destination); n.start(t); };

    /* soft wooden "tok" when the stamp touches the paper */

      const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter(); o.type='sine'; o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(130, t+.18);
      f.type='lowpass'; f.frequency.value=900; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.32, t+.015); g.gain.exponentialRampToValueAtTime(.0001, t+.35);
      o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t+.4); },
    /* gentle fireworks: distant soft puffs, each followed by a few twinkling bells (~3.5 s) */
    popper(){ const c = ac(); if (!c || !on()) return; const t0 = c.currentTime;
      const notes = [1046.5, 1174.7, 1318.5, 1568, 1760, 2093];

/* ===== Personavel – "Khoảnh khắc": square, Locket-style photos of the places you visit ===== */
(function(){
'use strict';
const {$, $$, esc, state} = PV;

/* photos live in IndexedDB (localStorage is far too small); the list of moments lives in state */
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('personavel', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('photos', mode); const s = t.objectStore('photos'); const q = fn(s); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  const mem = {};
  return {
    put: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => { mem[k] = v; }),
    get: (k) => tx('readonly', s => s.get(k)).then(v => v || mem[k] || null).catch(() => mem[k] || null),
    del: (k) => tx('readwrite', s => s.delete(k)).catch(() => { delete mem[k]; })
  };
})();
PV.photoDB = DB;
if (!Array.isArray(state.moments)) state.moments = PV.store.get('moments', []);
const ML = () => Array.isArray(state.moments) ? state.moments : (state.moments = PV.store.get('moments', []) || []);
if (PV.USER_KEYS && !PV.USER_KEYS.includes('moments')) PV.USER_KEYS.push('moments');

const SIZE = 720;
const toSquare = (src, mirror) => { // center-crop any image/video frame to a square JPEG
  const w = src.videoWidth || src.naturalWidth || src.width, h = src.videoHeight || src.naturalHeight || src.height;
  const s = Math.min(w, h), c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d'); if (mirror){ g.translate(SIZE, 0); g.scale(-1, 1); }
  g.drawImage(src, (w - s)/2, (h - s)/2, s, s, 0, 0, SIZE, SIZE);
  return c.toDataURL('image/jpeg', .8);
};
const fileToSquare = (f) => new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => res(toSquare(im)); im.onerror = () => res(null); im.src = r.result; }; r.readAsDataURL(f); });
const placeName = id => { const p = PV.byId(id); return p ? (PV.lang==='en' && p.name_en ? p.name_en : p.name) : ''; };
const nowStr = () => { const d = new Date(); return d.toLocaleDateString('vi-VN') + ' · ' + d.toTimeString().slice(0,5); };

/* ---------- camera sheet ---------- */
PV.snap = (presetPid) => {
  const old = $('#lk'); if (old) old.remove();
  const trip = (state.trip?.stops || []).map(s => s.id), vis = Object.keys(state.visited).reverse();
  const order = [...new Set([presetPid, ...trip, ...vis, ...PV.D.places.map(p=>p.id)].filter(Boolean))];
  const ov = document.createElement('div'); ov.id = 'lk'; ov.className = 'lk-ov'; ov.setAttribute('role','dialog');
  ov.innerHTML = `<div class="lk-sheet">
    <div class="lk-top"><button class="lk-x" aria-label="${PV.L('Đóng','Close')}">✕</button><b>${PV.L('Khoảnh khắc','Moment')}</b><span class="lk-sp"></span></div>
    <div class="lk-frame">
      <video playsinline autoplay muted></video><img class="lk-shot" alt="">
      <div class="lk-msg"></div>
      <div class="lk-loc">📍 <span></span></div>
      <input class="lk-cap" maxlength="44" placeholder="${PV.L('Thêm lời nhắn…','Add a message…')}">
    </div>
    <div class="lk-ctrl">
      <label class="lk-side" title="${PV.L('Tải ảnh lên','Upload a photo')}"><input type="file" accept="image/*" hidden>🖼️</label>
      <button class="lk-shutter" aria-label="${PV.L('Chụp','Take photo')}"><i></i></button>
      <button class="lk-side lk-flip" title="${PV.L('Đổi camera','Switch camera')}">🔄</button>
    </div>
    <div class="lk-ctrl2"><button class="lk-side lk-retake" title="${PV.L('Chụp lại','Retake')}">✕</button><button class="lk-send">${PV.L('Lưu khoảnh khắc','Save moment')} ➤</button></div>
    <label class="lk-where">${PV.L('Nơi đến','Place')}
      <select class="input">${order.map(id => `<option value="${id}">${esc(placeName(id))}</option>`).join('')}</select></label>
  </div>`;
  document.body.appendChild(ov);
  const video = $('video', ov), shot = $('.lk-shot', ov), msg = $('.lk-msg', ov), sel = $('select', ov), cap = $('.lk-cap', ov);
  let stream = null, facing = 'environment', data = null;
  const setLoc = () => { $('.lk-loc span', ov).textContent = placeName(sel.value); };
  sel.onchange = setLoc; setLoc();
  const stop = () => { if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } };
  const start = async () => {
    stop(); msg.textContent = PV.L('Đang mở camera…','Opening camera…'); msg.hidden = false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}, height:{ideal:1280}}, audio:false});
      video.srcObject = stream; video.classList.toggle('mirror', facing === 'user'); msg.hidden = true;
    } catch(e){
      msg.innerHTML = PV.L('Không mở được camera.<br>Bấm 🖼️ để tải ảnh từ máy lên nhé.','Camera unavailable.<br>Tap 🖼️ to upload a photo instead.');
    }
  };
  const mode = (m) => { ov.classList.toggle('taken', m === 'taken'); if (m === 'taken'){ shot.src = data; setTimeout(()=>cap.focus(), 50); } else { shot.removeAttribute('src'); cap.value = ''; } };
  const close = () => { stop(); ov.classList.add('out'); setTimeout(()=>ov.remove(), 220); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('.lk-x', ov).onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  $('.lk-shutter', ov).onclick = () => {
    if (!stream || !video.videoWidth) { msg.hidden = false; return; }
    data = toSquare(video, facing === 'user'); ov.classList.add('flash'); setTimeout(()=>ov.classList.remove('flash'), 250); mode('taken');
  };
  $('.lk-flip', ov).onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start(); };
  $('input[type=file]', ov).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; const d = await fileToSquare(f); if (!d) return PV.toast(PV.L('Không đọc được ảnh này','Could not read this image')); data = d; msg.hidden = true; mode('taken'); e.target.value = ''; };
  $('.lk-retake', ov).onclick = () => { data = null; mode('live'); if (!stream) start(); };
  $('.lk-send', ov).onclick = async () => {
    if (!data) return;
    const id = 'm' + Date.now();
    await DB.put(id, data);
    ML().unshift({id, pid: sel.value, cap: cap.value.trim(), at: nowStr()});
    PV.save('moments'); PV.addPoints(5);
    close(); PV.toast(PV.L('Đã lưu khoảnh khắc 📸','Moment saved 📸'));
    if (location.hash === '#profile') PV.route();
  };
  start();
};

/* ---------- grid + viewer ---------- */
PV.momentsHTML = (limit) => {
  const list = limit ? ML().slice(0, limit) : ML();
  return `<div class="lk-grid">
    <button class="lk-add" id="lkAdd"><span>📸</span><b>${PV.L('Chụp khoảnh khắc','Capture a moment')}</b><small>${PV.L('hoặc tải ảnh lên','or upload a photo')}</small></button>
    ${list.map(m => `<button class="lk-tile" data-mid="${m.id}"><img alt="" data-photo="${m.id}"><span class="lk-tloc">📍 ${esc(placeName(m.pid))}</span>${m.cap ? `<span class="lk-tcap">${esc(m.cap)}</span>` : ''}</button>`).join('')}
  </div>`;
};

      <div class="tiny muted" style="text-align:center;margin-top:8px">${esc(m.at || '')}</div>
      <div class="row" style="justify-content:center;margin-top:12px;gap:8px">
        <button class="btn ghost sm" id="lkPlace">🗺️ ${PV.L('Xem địa điểm','Open place')}</button>
        <a class="btn ghost sm" id="lkDl" download="personavel-${mid}.jpg" href="${src || '#'}">⬇️ ${PV.L('Tải ảnh','Download')}</a>
        <button class="btn ghost sm" id="lkDel">🗑️ ${PV.L('Xóa','Delete')}</button></div></div>`, (box, close) => {

    $('#lkDel', box).onclick = async () => { if (!confirmDel(box)) return; await DB.del(mid); state.moments = ML().filter(x => x.id !== mid); PV.save('moments'); close(); if (location.hash === '#profile') PV.route(); };
  });

function confirmDel(box){ const b = $('#lkDel', box); if (b.dataset.sure) return true; b.dataset.sure = 1; b.textContent = PV.L('Bấm lần nữa để xóa','Tap again to delete'); return false; }

/* ---------- hooks: profile diary card + place drawer ---------- */
const _profile = PV.views.profile;
PV.views.profile = (m) => {
  _profile(m);
  const card = [...m.querySelectorAll('.card')].find(c => c.querySelector('h3') && /Nhật ký|journal/i.test(c.querySelector('h3').textContent));
  if (card){
    const sec = document.createElement('div'); sec.className = 'lk-sec';
    sec.innerHTML = `<div class="row" style="margin-top:4px"><b>📸 ${PV.L('Khoảnh khắc','Moments')}</b><span class="tiny muted" style="margin-left:6px">${ML().length}</span></div>${PV.momentsHTML()}`;
    card.querySelector('.row').after(sec);

const _open = PV.openPlace;
PV.openPlace = (id, opt) => {

  const dr = document.getElementById('drawer'); const v = dr && dr.querySelector('#d-visit');
  if (v && !dr.querySelector('#d-snap')){
    const b = document.createElement('button'); b.className = 'btn ghost'; b.id = 'd-snap'; b.textContent = '📸 ' + PV.L('Chụp khoảnh khắc','Capture moment');
    b.onclick = () => PV.snap(id); v.after(b);

      b.parentElement.after(s); PV.bindMoments(s);

/* ===== Personavel – your own reviews: stars, favourite heart, notes for places you visited ===== */
(function(){

const {$, $$, esc, state} = PV;
const RV = () => (state.reviews && typeof state.reviews === 'object' && !Array.isArray(state.reviews)) ? state.reviews : (state.reviews = PV.store.get('reviews', {}) || {});
RV();
if (PV.USER_KEYS && !PV.USER_KEYS.includes('reviews')) PV.USER_KEYS.push('reviews');

const TAGS = [['Đáng quay lại','Worth returning'],['Cảnh đẹp','Beautiful'],['Ngon','Tasty'],['Giá hợp lý','Good value'],['Phục vụ tốt','Great service'],['Hơi đông','A bit crowded'],['Hợp chụp ảnh','Photogenic'],['Yên tĩnh','Quiet']];

const MOODTXT = [['',''],['Chưa ưng','Not great'],['Tạm được','Okay'],['Khá ổn','Good'],['Rất thích','Loved it'],['Tuyệt vời!','Amazing!']];

const starsHTML = (n, cls='') => `<span class="rv-stars ${cls}" aria-label="${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`;

function save(id, patch){
  const all = RV(); const first = !all[id];
  all[id] = {...(all[id]||{stars:0, fav:false, text:'', tags:[]}), ...patch, at: new Date().toLocaleDateString('vi-VN')};

  return `<div class="rv-box" id="rvBox">
    <div class="rv-head"><b>⭐ ${PV.L('Đánh giá của bạn','Your review')}</b>
      <button class="rv-heart ${r.fav?'on':''}" id="rvFav" aria-pressed="${r.fav}" title="${PV.L('Yêu thích','Favourite')}"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6l1 1.4 1-1.4C14 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg><span>${r.fav?PV.L('Đã yêu thích','Favourited'):PV.L('Yêu thích','Favourite')}</span></button></div>
